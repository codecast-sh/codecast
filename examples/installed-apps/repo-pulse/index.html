<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="codecast:height" content="620">
<title>Repo pulse</title>
<style>
@font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Medium.ttf"); font-weight: 500; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-Medium.ttf"); font-weight: 500; }
@font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-SemiBold.ttf"); font-weight: 600; }

:root {
  --bg: #050c08;
  --panel: rgba(20, 42, 31, .42);
  --line: rgba(120, 255, 170, .09);
  --text: #d9f5e3;
  --muted: #7fa08c;
  --dim: #4b6656;
  --phos: #8dffa6;
  --add: #5be38a;
  --del: #ff6b6b;
  --mod: #f4d35e;
  --ren: #7cc4ff;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 13px/1.5 "Instrument Sans", system-ui, sans-serif; color: var(--text);
  background:
    repeating-linear-gradient(0deg, rgba(141, 255, 166, .018) 0 1px, transparent 1px 3px),
    radial-gradient(70% 45% at 85% -5%, rgba(141, 255, 166, .13), transparent 70%),
    radial-gradient(60% 40% at -10% 110%, rgba(124, 196, 255, .07), transparent 70%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input { font: inherit; color: inherit; }

/* titleBar "hidden": the page draws the bar. The top 28 px stay free of
   controls (the macOS drag strip sits over them); the rest drags on Windows. */
.titlebar { height: 28px; flex: none; -webkit-app-region: drag; display: none; align-items: center; justify-content: center; color: var(--muted); font: 600 12px var(--mono); }
body.app .titlebar { display: flex; }

.bar { display: flex; gap: 10px; align-items: center; padding: 12px 18px; flex-wrap: wrap; }
body.app .bar { padding-top: 4px; }
.path {
  flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 0 6px 0 12px;
  background: rgba(0, 0, 0, .35); border: 1px solid var(--line); transition: border-color .15s;
}
.path:focus-within { border-color: rgba(141, 255, 166, .45); }
.path svg { flex: none; color: var(--dim); }
.path input { flex: 1; border: 0; outline: 0; background: none; padding: 9px 0; font: 13px var(--mono); }
.path input::placeholder { color: var(--dim); }
.go { border: 0; background: var(--phos); color: #052010; font-weight: 600; border-radius: 7px; padding: 5px 11px; cursor: pointer; }
.go:active { transform: scale(.97); }
.recent { display: flex; gap: 6px; flex-wrap: wrap; }
.recent button { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 3px 10px; font: 12px var(--mono); cursor: pointer; }
.recent button:hover { color: var(--text); border-color: rgba(141, 255, 166, .3); }

.summary { display: flex; align-items: baseline; gap: 18px; padding: 6px 18px 14px; flex-wrap: wrap; }
.branch { font: 700 22px/1.1 var(--mono); letter-spacing: -.02em; color: var(--phos); text-shadow: 0 0 18px rgba(141, 255, 166, .35); }
.stat { color: var(--muted); font: 12.5px var(--mono); }
.stat b { color: var(--text); font-weight: 500; }
.stat .a { color: var(--add); } .stat .d { color: var(--del); }
.live { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font: 12px var(--mono); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.live.on i { background: var(--phos); box-shadow: 0 0 0 0 rgba(141, 255, 166, .6); animation: beat 2s ease-out infinite; }
.live.busy i { background: var(--mod); }
@keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(141, 255, 166, .55); } 70%, 100% { box-shadow: 0 0 0 8px rgba(141, 255, 166, 0); } }

.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; padding: 0 12px 12px; }
@media (max-width: 680px) { .grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
.panel { min-height: 0; display: flex; flex-direction: column; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.panel h2 { margin: 0; padding: 11px 14px 9px; font: 600 12.5px "Instrument Sans", system-ui; color: var(--muted); display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
.panel h2 span { font: 12px var(--mono); color: var(--dim); }
.scroll { flex: 1; overflow-y: auto; padding: 6px; scrollbar-width: thin; scrollbar-color: #1d3a2a transparent; }

.file {
  display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left;
  border: 0; background: none; padding: 6px 8px; border-radius: 8px; cursor: pointer; font: 12.5px var(--mono);
}
.file:hover { background: rgba(141, 255, 166, .06); }
.st { font-weight: 700; text-align: center; border-radius: 5px; font-size: 11px; padding: 1px 0; }
.st.M { color: var(--mod); background: rgba(244, 211, 94, .1); }
.st.A { color: var(--add); background: rgba(91, 227, 138, .1); }
.st.D { color: var(--del); background: rgba(255, 107, 107, .1); }
.st.R { color: var(--ren); background: rgba(124, 196, 255, .1); }
.st.U { color: var(--muted); background: rgba(127, 160, 140, .1); }
.fp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.fp bdi { direction: ltr; }
.fp .dir { color: var(--dim); }
.fp .staged { color: var(--phos); font-size: 10.5px; margin-left: 6px; }
.delta { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.delta .a { color: var(--add); } .delta .d { color: var(--del); }
.blocks { display: flex; gap: 1.5px; }
.blocks i { width: 6px; height: 9px; border-radius: 1.5px; background: rgba(127, 160, 140, .18); }
.blocks i.a { background: var(--add); } .blocks i.d { background: var(--del); }
.file.pulse { animation: pulse 1.2s ease-out; }
@keyframes pulse { from { background: rgba(141, 255, 166, .18); } to { background: transparent; } }

.commit { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 0 8px; position: relative; }
.commit::before { content: ""; position: absolute; left: 15px; top: 0; bottom: 0; width: 1.5px; background: #1d3a2a; }
.commit:first-child::before { top: 14px; }
.commit:last-child::before { bottom: calc(100% - 14px); }
.commit .node { width: 9px; height: 9px; margin: 10px 0 0 4px; border-radius: 50%; border: 2px solid var(--phos); background: var(--bg); position: relative; z-index: 1; }
.commit:first-child .node { background: var(--phos); box-shadow: 0 0 10px rgba(141, 255, 166, .6); }
.commit .body { padding: 6px 0 8px; min-width: 0; }
.commit .subj { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.commit .meta { color: var(--dim); font: 11.5px var(--mono); display: flex; gap: 10px; }
.commit .meta .h { color: var(--muted); }
.ref { color: var(--ren); }

.state { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; }
.state .card { max-width: 400px; }
.state img { width: 88px; height: 88px; filter: drop-shadow(0 12px 28px rgba(0, 0, 0, .5)); }
.state h1 { font: 600 20px/1.25 "Instrument Sans", system-ui; margin: 14px 0 6px; }
.state p { color: var(--muted); margin: 0 0 16px; }
.state code { font: 12px var(--mono); color: var(--phos); background: rgba(0, 0, 0, .3); border-radius: 6px; padding: 2px 6px; }
.state .why { display: inline-block; font: 12px var(--mono); color: var(--del); border: 1px solid rgba(255, 107, 107, .3); border-radius: 999px; padding: 3px 10px; margin-bottom: 12px; }
.clean { padding: 30px 10px; text-align: center; color: var(--muted); }
.clean b { display: block; color: var(--phos); font: 700 18px var(--mono); margin-bottom: 2px; }
.err { margin: 0 18px 10px; padding: 9px 12px; border-radius: 10px; background: rgba(255, 107, 107, .1); color: #ffb3b3; font: 12px var(--mono); white-space: pre-wrap; }

.reveal { animation: up .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 18ms); }
@keyframes up { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .reveal, .file.pulse, .live.on i { animation: none; } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="titlebar" id="titlebar">Repo pulse</div>
<form class="bar" id="form">
  <label class="path">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 4.5a1 1 0 0 1 1-1h3.6l1.4 1.6h6a1 1 0 0 1 1 1v6.4a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg>
    <input id="path" spellcheck="false" autocomplete="off" placeholder="~/src/your-repo">
    <button class="go" type="submit">Open</button>
  </label>
  <div class="recent" id="recent"></div>
</form>
<div id="error"></div>
<section class="summary" id="summary" hidden>
  <span class="branch" id="branch"></span>
  <span class="stat" id="track"></span>
  <span class="stat" id="totals"></span>
  <span class="live" id="live"><i></i><span>watching</span></span>
</section>
<div class="grid" id="grid" hidden>
  <section class="panel"><h2>Changes <span id="n-files"></span></h2><div class="scroll" id="files"></div></section>
  <section class="panel"><h2>Recent commits <span id="n-commits"></span></h2><div class="scroll" id="commits"></div></section>
</div>
<div class="state" id="state" hidden></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const app = window.cast?.app;
const info = app ? await app.info().catch(() => null) : null;
if (app) document.body.classList.add("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ago = (sec) => {
  const s = Date.now() / 1000 - sec;
  if (s < 60) return "now";
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)}d`;
  return new Date(sec * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" });
};

// ── where full access stops: one screen per reason ──
const REASONS = {
  "needs-consent": ["Full access isn't approved for this version", "Repo pulse runs git and watches files in the folder you pick. Approve full access to continue.", true],
  denied: ["You declined full access", "Repo pulse can't read a folder without it. You can approve it here or in Codecast's Settings, Installed apps.", true],
  "not-allowed-by-team": ["Your team keeps installed apps off your files", "A team admin turned off full access for installed apps. Ask them to allow it in the team's settings.", false],
  "not-your-page": ["Full access is only for your own pages", "This page comes from outside your teams, so Codecast won't let it run programs or read files.", false],
  "mixed-version": ["A new version is loading", "The page was republished. It reloads in a moment.", false],
  "not-installed": ["This app isn't installed", "Install it from the page's Share menu, Install as app.", false],
};
function refuse(code, message) {
  const [title, body, canAsk] = REASONS[code] ?? ["Couldn't read the folder", message || "Something went wrong.", false];
  show("state");
  $("state").innerHTML = `<div class="card reveal">
    <img src="icon.png" alt="">
    <h1>${esc(title)}</h1>
    <div class="why">${esc(code || "failed")}</div>
    <p>${esc(body)}</p>
    ${canAsk ? `<button class="go" id="grant" type="button">Approve full access</button>` : ""}
  </div>`;
  if (canAsk) $("grant").onclick = async () => {
    try { await app.permissions.request(["full-access"]); load(); }
    catch (e) { refuse(e.code, e.message); }
  };
}
function show(which) {
  $("state").hidden = which !== "state";
  $("grid").hidden = $("summary").hidden = which !== "repo";
}


// ── git ──
let git = null;
const GITS = ["git", "/usr/bin/git", "/opt/homebrew/bin/git", "/usr/local/bin/git", "C:\\Program Files\\Git\\cmd\\git.exe"];
async function run(args, cwd) {
  const order = git ? [git] : GITS;
  let last;
  for (const bin of order) {
    try {
      const r = await app.process.run(bin, ["--no-optional-locks", ...args], { cwd, timeoutMs: 20_000, env: { GIT_TERMINAL_PROMPT: "0", LC_ALL: "C" } });
      git = bin;
      return r;
    } catch (e) {
      last = e;
      // A refusal is about the app, not the binary: stop at once.
      if (e.code !== "failed" || !/ENOENT|not found/i.test(e.message)) throw e;
    }
  }
  throw Object.assign(new Error("git isn't installed, or isn't on Codecast's PATH"), { code: "failed" });
}
function parseStatus(out) {
  const parts = out.split("\0");
  let branch = { name: "", upstream: "", ahead: 0, behind: 0 };
  const files = [];
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (!p) continue;
    if (p.startsWith("## ")) {
      const m = p.slice(3).match(/^(?:No commits yet on )?([^.\s]+(?:\.(?!\.)[^.\s]*)*)(?:\.\.\.(\S+))?(?: \[(.*)\])?/);
      if (m) branch = { name: m[1], upstream: m[2] ?? "", ahead: +(m[3]?.match(/ahead (\d+)/)?.[1] ?? 0), behind: +(m[3]?.match(/behind (\d+)/)?.[1] ?? 0) };
      if (p.includes("HEAD (no branch)")) branch.name = "detached";
      continue;
    }
    const x = p[0], y = p[1], path = p.slice(3);
    let from = null;
    if (x === "R" || x === "C") from = parts[++i];
    const code = x === "?" ? "U" : x === "R" || y === "R" ? "R" : x === "D" || y === "D" ? "D" : x === "A" ? "A" : "M";
    files.push({ path, from, code, staged: x !== " " && x !== "?", raw: x + y });
  }
  return { branch, files };
}
function parseNumstat(out) {
  const map = new Map();
  const parts = out.split("\0");
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (!p) continue;
    const [a, d, path] = p.split("\t");
    const name = path === "" ? (i += 2, parts[i]) : path;
    map.set(name, { add: a === "-" ? null : +a, del: d === "-" ? null : +d });
  }
  return map;
}
function parseLog(out) {
  return out.split("\x1e").map((s) => s.trim()).filter(Boolean).map((s) => {
    const [h, an, at, refs, subj] = s.split("\x1f");
    return { h, an, at: +at, refs: refs.split(", ").filter((r) => r && !r.startsWith("HEAD")).map((r) => r.replace(/^tag: /, "#")), subj };
  });
}

// ── state ──
const RECENT = "repo-pulse:recent";
const recent = () => { try { return JSON.parse(localStorage.getItem(RECENT)) || []; } catch { return []; } };
let root = null;
let opened = null; // the path as typed, which the recent list keeps
let last = null;
let busy = false, again = false;
// The home folder reads as ~, the way people type it.
const tilde = (p) => p.replace(/^(\/Users\/[^/]+|\/home\/[^/]+|[A-Za-z]:\\Users\\[^\\]+)(?=$|[\\/])/, "~");
const base = (p) => p.replace(/[\\/]+$/, "").replace(/^.*[\\/]/, "");

function start() {
  const r = recent();
  $("path").value = r[0] ?? "";
  paintRecent();
  $("form").onsubmit = (e) => { e.preventDefault(); open($("path").value.trim()); };
  if (r[0]) open(r[0]);
  else { show("state"); $("state").innerHTML = `<div class="card reveal"><img src="icon.png" alt=""><h1>Pick a repository</h1><p>Type a folder path above, like <code>~/src/app</code>. It's remembered on this computer.</p></div>`; $("path").focus(); }
}
function paintRecent() {
  $("recent").innerHTML = recent().slice(0, 4).filter((p) => p !== opened && tilde(p) !== $("path").value.trim()).map((p) => `<button type="button" data-p="${esc(p)}">${esc(base(p))}</button>`).join("");
  for (const b of $("recent").children) b.onclick = () => { $("path").value = b.dataset.p; open(b.dataset.p); };
}
async function open(path) {
  if (!path) return;
  $("error").innerHTML = "";
  try {
    const top = await run(["rev-parse", "--show-toplevel"], path);
    if (top.code !== 0) return void ($("error").innerHTML = `<div class="err">${esc(top.stderr.trim() || "not a git repository")}</div>`);
    await stopWatching();
    root = top.stdout.trim();
    opened = path;
    localStorage.setItem(RECENT, JSON.stringify([path, ...recent().filter((p) => p !== path)].slice(0, 8)));
    paintRecent();
    last = null;
    $("path").value = tilde(root);
    app.window.setTitle(`${base(root)} · Repo pulse`).catch(() => {});
    $("titlebar").textContent = base(root);
    await load();
  } catch (e) { refuse(e.code, e.message); }
}

async function load() {
  if (!root) return start();
  if (busy) return void (again = true);
  busy = true;
  $("live").classList.add("busy");
  try {
    const [st, num, log] = await Promise.all([
      run(["status", "--porcelain=v1", "-z", "--branch"], root),
      run(["diff", "--numstat", "-z", "HEAD"], root),
      run(["log", "-n", "40", "--pretty=format:%h%x1f%an%x1f%at%x1f%D%x1f%s%x1e"], root),
    ]);
    if (st.code !== 0) throw Object.assign(new Error(st.stderr.trim()), { code: "failed" });
    const s = parseStatus(st.stdout);
    const n = num.code === 0 ? parseNumstat(num.stdout) : new Map();
    const commits = log.code === 0 ? parseLog(log.stdout) : [];
    const changedPaths = last ? new Set(s.files.filter((f) => { const o = last.files.find((x) => x.path === f.path); return !o || o.raw !== f.raw || JSON.stringify(o.n) !== JSON.stringify(n.get(f.path) ?? null); }).map((f) => f.path)) : new Set();
    for (const f of s.files) f.n = n.get(f.path) ?? null;
    paint(s, commits, changedPaths);
    last = { files: s.files };
    await watch(s.files);
  } catch (e) {
    refuse(e.code, e.message);
  } finally {
    busy = false;
    $("live").classList.remove("busy");
    if (again) { again = false; load(); }
  }
}

function blocks(add, del) {
  const total = add + del;
  if (!total) return "";
  const k = Math.min(5, Math.max(1, Math.ceil(Math.log2(total + 1) / 2)));
  const a = Math.round((add / total) * k);
  return `<span class="blocks">${Array.from({ length: 5 }, (_, i) => `<i class="${i < a ? "a" : i < k ? "d" : ""}"></i>`).join("")}</span>`;
}
function delta(f) {
  if (f.code === "U") return "new";
  if (!f.n) return f.code === "R" ? "renamed" : "";
  if (f.n.add === null) return "binary";
  if (!f.n.add && !f.n.del) return f.code === "R" ? "renamed" : "mode";
  return `${f.n.add ? `<span class="a">+${f.n.add}</span>` : ""}${f.n.del ? `<span class="d">−${f.n.del}</span>` : ""}${blocks(f.n.add, f.n.del)}`;
}
function paint(s, commits, changed) {
  show("repo");
  const { branch } = s;
  $("branch").textContent = branch.name || "(no branch)";
  $("track").innerHTML = branch.upstream
    ? `${esc(branch.upstream)} ${branch.ahead || branch.behind ? `<b>${branch.ahead ? `↑${branch.ahead}` : ""}${branch.ahead && branch.behind ? " " : ""}${branch.behind ? `↓${branch.behind}` : ""}</b>` : "<b>in sync</b>"}`
    : "no upstream";
  const add = s.files.reduce((t, f) => t + (f.n?.add ?? 0), 0);
  const del = s.files.reduce((t, f) => t + (f.n?.del ?? 0), 0);
  $("totals").innerHTML = s.files.length ? `<b>${s.files.length}</b> changed <span class="a">+${add.toLocaleString()}</span> <span class="d">−${del.toLocaleString()}</span>` : "<b>clean</b>";
  $("n-files").textContent = s.files.length || "";
  $("n-commits").textContent = commits.length || "";

  const firstPaint = !$("files").children.length;
  const order = { U: 4, D: 2, R: 1, A: 0, M: 0 };
  const files = [...s.files].sort((a, b) => (order[a.code] - order[b.code]) || a.path.localeCompare(b.path));
  $("files").innerHTML = files.length ? files.map((f, i) => {
    // An untracked folder arrives as "dir/": name it, slash kept.
    const bare = f.path.replace(/\/$/, "");
    const cut = bare.lastIndexOf("/");
    const dir = cut >= 0 ? bare.slice(0, cut + 1) : "";
    const name = bare.slice(cut + 1) + (bare === f.path ? "" : "/");
    return `<button class="file${firstPaint ? " reveal" : ""}${changed.has(f.path) ? " pulse" : ""}" style="--i:${Math.min(i, 30)}" data-p="${esc(f.path)}" title="${esc(f.from ? `${f.from} → ${f.path}` : f.path)}">
      <span class="st ${f.code}">${f.code === "U" ? "?" : f.code}</span>
      <span class="fp"><bdi><span class="dir">${esc(dir)}</span>${esc(name)}${f.staged ? '<span class="staged">staged</span>' : ""}</bdi></span>
      <span class="delta">${delta(f)}</span>
    </button>`;
  }).join("") : `<div class="clean"><b>Clean</b>Nothing to commit on ${esc(branch.name)}.</div>`;
  for (const b of $("files").querySelectorAll(".file")) b.onclick = () => app.shell.open(`${root}/${b.dataset.p}`).catch((e) => refuse(e.code, e.message));

  $("commits").innerHTML = commits.map((c, i) => `<div class="commit${firstPaint ? " reveal" : ""}" style="--i:${Math.min(i, 30)}">
      <span class="node"></span>
      <div class="body"><div class="subj" title="${esc(c.subj)}">${esc(c.subj)}</div>
      <div class="meta"><span class="h">${esc(c.h)}</span><span>${esc(c.an)}</span><span>${ago(c.at)}</span>${c.refs.map((r) => `<span class="ref">${esc(r)}</span>`).join("")}</div></div>
    </div>`).join("") || `<div class="clean">No commits yet.</div>`;
}

// ── watching: the root, .git (index, HEAD, refs) and each changed file's folder ──
const watches = new Map(); // dir -> stop()
let timer = null;
const kick = () => { clearTimeout(timer); timer = setTimeout(load, 350); };
async function watch(files) {
  const sep = root.includes("\\") ? "\\" : "/";
  const want = new Set([root, `${root}${sep}.git`, `${root}${sep}.git${sep}refs${sep}heads`]);
  for (const f of files) {
    const cut = f.path.lastIndexOf("/");
    if (cut > 0) want.add(`${root}${sep}${f.path.slice(0, cut).split("/").join(sep)}`);
    if (want.size >= 48) break;
  }
  for (const [dir, stop] of watches) if (!want.has(dir)) { watches.delete(dir); stop().catch?.(() => {}); }
  await Promise.all([...want].filter((d) => !watches.has(d)).map(async (dir) => {
    try { watches.set(dir, await app.fs.watch(dir, (ev) => { if (!/[\\/]\.git[\\/](objects|logs)|index\.lock$/.test(ev.path ?? "")) kick(); })); }
    catch (e) { if (e.code !== "failed") throw e; }
  }));
  $("live").classList.toggle("on", watches.size > 0);
  $("live").querySelector("span").textContent = watches.size ? `watching ${watches.size} folders` : "not watching";
}
async function stopWatching() {
  await Promise.all([...watches.values()].map((stop) => Promise.resolve(stop()).catch(() => {})));
  watches.clear();
}
// The watches are not recursive, so they miss the first edit in a folder that
// had no changes yet. Looking again every few seconds while the window is on
// screen (and when it comes forward) covers that.
window.addEventListener("focus", () => { if (root) kick(); });
setInterval(() => { if (root && !busy && !document.hidden) load(); }, 4000);
app?.on("grants", () => load());

if (!app) {
  show("state");
  $("form").hidden = true;
  $("state").innerHTML = `<div class="card reveal">
    <img src="icon.png" alt="">
    <h1>Repo pulse runs on your computer</h1>
    <p>It reads git status and history from a folder you choose, which a browser tab can't do. Install it as an app from this page's Share menu, then approve full access.</p>
  </div>`;
} else start();
</script>
</body>
</html>
