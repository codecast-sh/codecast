name: Cut signed CLI release

# The CI builder for CLI releases. It replaces the laptop half of a release:
# build all five binaries on a macOS runner, sign the two darwin ones with the
# Developer ID identity held in repo secrets, upload the staging objects to R2,
# then dispatch "Finalize pre-uploaded CLI release", which validates, publishes
# the immutable objects, commits the version bump, tags, and creates the GitHub
# release. Nobody needs the signing certificate in a personal keychain.
#
# Secrets: MACOS_SIGN_CERT_P12 (base64 of the Developer ID Application .p12,
# certificate + private key) and MACOS_SIGN_CERT_PASSPHRASE (its passphrase).
# Rotate by replacing both secrets; the laptop keychain stays the escrow copy.
#
# Not covered here: npm publish and the Homebrew tap. Those remain laptop-only
# mirrors in packages/cli/scripts/deploy.sh.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and verify only. Upload nothing, dispatch nothing.
        required: false
        default: false
        type: boolean
      wait_minutes:
        description: How long the finalize workflow waits for the staging objects
        required: false
        default: "30"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: cli-release-builder
  cancel-in-progress: false

env:
  R2_BUCKET: codecast
  CODECAST_SIGN_IDENTITY: "Developer ID Application: Ashot Petrosian (WRG9THCK9Q)"
  SIGN_TEAM_ID: WRG9THCK9Q

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve the release identity
        shell: bash
        run: |
          set -euo pipefail
          previous=$(jq -r '.version' packages/cli/package.json)
          if [[ ! "$previous" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::packages/cli/package.json version is not a canonical semver: $previous"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$previous"
          version="$major.$minor.$((patch + 1))"
          source_commit=$(git rev-parse HEAD)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version already exists"
            exit 1
          fi
          {
            echo "PREVIOUS_VERSION=$previous"
            echo "RELEASE_VERSION=$version"
            echo "SOURCE_COMMIT=$source_commit"
          } >> "$GITHUB_ENV"
          echo "Building $version (after $previous) from $source_commit"

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Import the signing identity into a throwaway keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_SIGN_CERT_P12 }}
          CERT_PASSPHRASE: ${{ secrets.MACOS_SIGN_CERT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CERT_P12_BASE64" || -z "$CERT_PASSPHRASE" ]]; then
            echo "::error::MACOS_SIGN_CERT_P12 and MACOS_SIGN_CERT_PASSPHRASE must both be set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/codecast-sign.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          cert="$RUNNER_TEMP/codecast-sign.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$cert"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 5400 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$CERT_PASSPHRASE" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          # Let codesign use the key without a UI consent prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          # build-binaries.sh looks the identity up through the search list.
          existing=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$keychain" $existing
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          if ! security find-identity -v -p codesigning | grep -qF "$CODECAST_SIGN_IDENTITY"; then
            echo "::error::imported keychain does not contain: $CODECAST_SIGN_IDENTITY"
            security find-identity -v -p codesigning || true
            exit 1
          fi

      - name: Build and sign the binaries
        shell: bash
        run: |
          set -euo pipefail
          jq --arg version "$RELEASE_VERSION" '.version = $version' \
            packages/cli/package.json > /tmp/cli-package.json
          mv /tmp/cli-package.json packages/cli/package.json
          cd packages/cli
          ./scripts/build-binaries.sh

      - name: Remove the signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGN_KEYCHAIN:-}" && -f "$SIGN_KEYCHAIN" ]]; then
            security delete-keychain "$SIGN_KEYCHAIN"
          fi

      - name: Verify the signatures and embedded version
        shell: bash
        run: |
          set -euo pipefail
          cd packages/web/binaries
          for artifact in codecast-darwin-arm64 codecast-darwin-x64; do
            codesign --verify --strict --verbose=2 "$artifact"
            info=$(codesign -dvv "$artifact" 2>&1)
            grep -q "^Identifier=sh.codecast.cli$" <<<"$info"
            grep -q "^TeamIdentifier=$SIGN_TEAM_ID$" <<<"$info"
            grep -q "^Authority=$CODECAST_SIGN_IDENTITY$" <<<"$info"
            echo "$artifact: signed by $CODECAST_SIGN_IDENTITY"
          done
          chmod +x codecast-darwin-arm64
          actual=$(./codecast-darwin-arm64 --version | tr -d '[:space:]')
          if [[ "$actual" != "$RELEASE_VERSION" ]]; then
            echo "::error::darwin-arm64 reports version $actual, expected $RELEASE_VERSION"
            exit 1
          fi

      - name: Write the artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          cd packages/web/binaries
          manifest='{}'
          for artifact in \
            codecast-darwin-arm64 \
            codecast-darwin-x64 \
            codecast-linux-arm64 \
            codecast-linux-x64 \
            codecast-windows-x64.exe; do
            sha=$(shasum -a 256 "$artifact" | awk '{print $1}')
            size=$(stat -f%z "$artifact")
            manifest=$(jq -c \
              --arg artifact "$artifact" \
              --arg sha "$sha" \
              --argjson size "$size" \
              '.[$artifact] = {sha256: $sha, size: $size}' <<<"$manifest")
          done
          jq -c -n \
            --arg version "$RELEASE_VERSION" \
            --arg source "$SOURCE_COMMIT" \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson artifacts "$manifest" \
            '{version: $version, source_commit: $source, built: $built, artifacts: $artifacts}' \
            > "$RUNNER_TEMP/release-manifest.json"
          jq . "$RUNNER_TEMP/release-manifest.json"
          {
            echo "### CLI $RELEASE_VERSION builder"
            echo
            echo "- Source: \`$SOURCE_COMMIT\`"
            echo '- Manifest:'
            echo '```json'
            jq . "$RUNNER_TEMP/release-manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the dry-run build for inspection
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ env.RELEASE_VERSION }}-dry-run
          retention-days: 3
          if-no-files-found: error
          path: |
            packages/web/binaries/codecast-darwin-arm64
            packages/web/binaries/codecast-darwin-x64
            ${{ runner.temp }}/release-manifest.json

      - name: Upload the staging objects to R2
        if: ${{ !inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          # The finalize workflow only trusts staging objects modified strictly
          # after this timestamp; the sleep keeps the first upload out of the
          # cutoff second.
          uploaded_after=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "UPLOADED_AFTER=$uploaded_after" >> "$GITHUB_ENV"
          sleep 2
          cd packages/web/binaries
          for artifact in \
            codecast-darwin-arm64 \
            codecast-darwin-x64 \
            codecast-linux-arm64 \
            codecast-linux-x64 \
            codecast-windows-x64.exe \
            index.js.map; do
            aws s3 cp "$artifact" "s3://$R2_BUCKET/$artifact" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/octet-stream \
              --no-progress
          done

      - name: Dispatch the finalize workflow
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run finalize-cli-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "version=$RELEASE_VERSION" \
            -f "previous_version=$PREVIOUS_VERSION" \
            -f "source_commit=$SOURCE_COMMIT" \
            -f "artifact_manifest=$(cat "$RUNNER_TEMP/release-manifest.json")" \
            -f "uploaded_after=$UPLOADED_AFTER" \
            -f "wait_minutes=${{ inputs.wait_minutes }}"
          echo "- Finalize dispatched for $RELEASE_VERSION (previous $PREVIOUS_VERSION)" >> "$GITHUB_STEP_SUMMARY"
