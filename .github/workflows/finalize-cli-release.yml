name: Finalize pre-uploaded CLI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver to publish
        required: true
        type: string
      previous_version:
        description: Exact currently published predecessor
        required: true
        type: string
      source_commit:
        description: Full 40-character commit used to build the binaries
        required: true
        type: string
      artifact_manifest:
        description: Builder-produced JSON with version, source_commit, built, and exact artifact hashes/sizes
        required: true
        type: string
      uploaded_after:
        description: Ignore mutable staging objects older than this ISO-8601 timestamp
        required: true
        type: string
      wait_minutes:
        description: Maximum time to wait for the background upload
        required: true
        default: "180"
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: cli-release
  cancel-in-progress: false

env:
  R2_BUCKET: codecast
  RELEASE_VERSION: ${{ inputs.version }}
  PREVIOUS_VERSION: ${{ inputs.previous_version }}
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  EXPECTED_ARTIFACTS_JSON: ${{ inputs.artifact_manifest }}
  UPLOADED_AFTER: ${{ inputs.uploaded_after }}
  WAIT_MINUTES: ${{ inputs.wait_minutes }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          deps: none

      - name: Validate immutable release identity and source
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(
            codecast-darwin-arm64
            codecast-darwin-x64
            codecast-linux-arm64
            codecast-linux-x64
            codecast-windows-x64.exe
          )

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            [[ ! "$PREVIOUS_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::versions must be canonical three-part semvers"
            exit 1
          fi
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_commit must be a full lowercase 40-character SHA"
            exit 1
          fi
          if [[ ! "$WAIT_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::wait_minutes must contain decimal digits only"
            exit 1
          fi
          wait_decimal=$((10#$WAIT_MINUTES))
          if (( wait_decimal < 1 || wait_decimal > 300 )); then
            echo "::error::wait_minutes must be between 1 and 300"
            exit 1
          fi
          date -u -d "$UPLOADED_AFTER" +%s >/dev/null

          IFS=. read -r previous_major previous_minor previous_patch <<<"$PREVIOUS_VERSION"
          IFS=. read -r release_major release_minor release_patch <<<"$RELEASE_VERSION"
          if (( release_major != previous_major ||
            release_minor != previous_minor ||
            release_patch != previous_patch + 1 )); then
            echo "::error::release version must be exactly one patch after previous_version"
            exit 1
          fi

          git fetch origin main --tags
          git checkout --detach origin/main
          resolved_source=$(git rev-parse "${SOURCE_COMMIT}^{commit}")
          if [[ "$resolved_source" != "$SOURCE_COMMIT" ]]; then
            echo "::error::source_commit did not resolve to itself"
            exit 1
          fi
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD

          printf '%s' "$EXPECTED_ARTIFACTS_JSON" | jq -S . > /tmp/release-expected.json
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg source "$SOURCE_COMMIT" \
            '.version == $version and
             .source_commit == $source and
             (.built | type == "string" and length > 0) and
             (.artifacts | type == "object")' \
            /tmp/release-expected.json >/dev/null
          if [[ "$(jq -r '.artifacts | keys | length' /tmp/release-expected.json)" != "5" ]]; then
            echo "::error::artifact manifest must contain exactly five entries"
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            jq -e \
              --arg artifact "$artifact" \
              '.artifacts[$artifact].sha256 |
               type == "string" and test("^[0-9a-f]{64}$")' \
              /tmp/release-expected.json >/dev/null
            jq -e \
              --arg artifact "$artifact" \
              '.artifacts[$artifact].size |
               type == "number" and . > 1000000 and floor == .' \
              /tmp/release-expected.json >/dev/null
            # The cast computer helper is a separately signed app bundle inside
            # the darwin binaries, so it is part of what a darwin artifact IS.
            # A darwin entry without it means the builder shipped a macOS CLI
            # that cannot drive the Mac; a non-darwin entry with it means the
            # helper leaked into a build that can never run it. (ct-49524)
            case "$artifact" in
              codecast-darwin-*)
                jq -e \
                  --arg artifact "$artifact" \
                  '.artifacts[$artifact].computer_helper_sha256 |
                   type == "string" and test("^[0-9a-f]{64}$")' \
                  /tmp/release-expected.json >/dev/null
                ;;
              *)
                jq -e \
                  --arg artifact "$artifact" \
                  '.artifacts[$artifact] | has("computer_helper_sha256") | not' \
                  /tmp/release-expected.json >/dev/null
                ;;
            esac
          done
          # One helper per release: the builder compiles and signs it once and
          # embeds the same bytes in both darwin binaries. Two hashes here would
          # mean two different helpers went out under one version.
          if ! jq -e '.artifacts["codecast-darwin-arm64"].computer_helper_sha256 ==
                      .artifacts["codecast-darwin-x64"].computer_helper_sha256' \
                 /tmp/release-expected.json >/dev/null; then
            echo "::error::the two darwin artifacts carry different cast computer helpers"
            exit 1
          fi
          expected_keys=$(jq -r '.artifacts | keys[]' /tmp/release-expected.json)
          actual_keys=$(printf '%s\n' "${artifacts[@]}" | sort)
          if [[ "$(sort <<<"$expected_keys")" != "$actual_keys" ]]; then
            echo "::error::artifact manifest contains an unexpected filename"
            exit 1
          fi

          # The release is the build it made: latest.json names SOURCE_COMMIT and the
          # binaries are checked against that commit's manifest, CI and fallback build.
          # CLI commits that landed on main after it are not carried; they go out with
          # the next release, cut at the new head (ct-102056).

          current=$(jq -r '.version' packages/cli/package.json)
          if [[ "$current" != "$PREVIOUS_VERSION" && "$current" != "$RELEASE_VERSION" ]]; then
            echo "::error::main package version is neither the predecessor nor the recovery target"
            exit 1
          fi

          public_latest=$(curl -fsSL --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -H 'Cache-Control: no-cache' \
            "https://dl.codecast.sh/latest.json")
          public_version=$(jq -r '.version' <<<"$public_latest")
          if [[ "$public_version" != "$PREVIOUS_VERSION" &&
            "$public_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::public latest.json is neither the predecessor nor the recovery target"
            exit 1
          fi
          public_source=$(jq -r '.sourceCommit // ""' <<<"$public_latest")
          if [[ "$public_version" == "$RELEASE_VERSION" && "$public_source" != "$SOURCE_COMMIT" ]]; then
            echo "::error::$RELEASE_VERSION is already public from $public_source, not $SOURCE_COMMIT"
            exit 1
          fi

      - name: Build exact non-macOS fallbacks while signed artifacts upload
        shell: bash
        run: |
          set -euo pipefail
          build_root=/tmp/cli-fallback-build
          output_root=/tmp/cli-fallback
          git worktree add --detach "$build_root" "$SOURCE_COMMIT"
          jq --arg version "$RELEASE_VERSION" '.version = $version' \
            "$build_root/packages/cli/package.json" > /tmp/fallback-cli-package.json
          mv /tmp/fallback-cli-package.json "$build_root/packages/cli/package.json"
          (
            cd "$build_root"
            bun install --frozen-lockfile
          )
          mkdir -p "$output_root"
          (
            cd "$build_root/packages/cli"
            bash scripts/guard-no-src-shadow.sh
            for target in linux-arm64 linux-x64 windows-x64; do
              if [[ "$target" == "windows-x64" ]]; then
                artifact="codecast-$target.exe"
              else
                artifact="codecast-$target"
              fi
              bun build src/index.ts \
                --compile \
                --no-compile-autoload-dotenv \
                --target="bun-$target" \
                --minify \
                --sourcemap \
                --outfile="$output_root/$artifact"
            done
          )

          : > /tmp/cli-fallback-ready
          for artifact in \
            codecast-linux-arm64 \
            codecast-linux-x64 \
            codecast-windows-x64.exe; do
            expected_sha=$(jq -r \
              --arg artifact "$artifact" \
              '.artifacts[$artifact].sha256' \
              /tmp/release-expected.json)
            expected_bytes=$(jq -r \
              --arg artifact "$artifact" \
              '.artifacts[$artifact].size' \
              /tmp/release-expected.json)
            actual_sha=$(sha256sum "$output_root/$artifact" | awk '{print $1}')
            actual_bytes=$(stat -c %s "$output_root/$artifact")
            if [[ "$actual_sha" == "$expected_sha" && "$actual_bytes" == "$expected_bytes" ]]; then
              echo "$artifact" >> /tmp/cli-fallback-ready
              echo "$artifact reproduced byte-for-byte on the release runner"
            else
              echo "::warning::$artifact was not byte-identical; waiting for the builder upload"
            fi
          done

      - name: Wait for all five mutable staging objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(
            codecast-darwin-arm64
            codecast-darwin-x64
            codecast-linux-arm64
            codecast-linux-x64
            codecast-windows-x64.exe
          )
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key latest.json \
            --endpoint-url "$R2_ENDPOINT" >/dev/null

          cutoff_epoch=$(date -u -d "$UPLOADED_AFTER" +%s)
          wait_decimal=$((10#$WAIT_MINUTES))
          deadline=$(( $(date +%s) + wait_decimal * 60 ))

          while true; do
            all_ready=true
            : > /tmp/cli-object-state.txt
            : > /tmp/cli-object-snapshot.tsv
            for artifact in "${artifacts[@]}"; do
              if grep -Fxq "$artifact" /tmp/cli-fallback-ready; then
                expected_bytes=$(jq -r \
                  --arg artifact "$artifact" \
                  '.artifacts[$artifact].size' \
                  /tmp/release-expected.json)
                printf '%s ready from byte-identical runner build bytes=%s\n' \
                  "$artifact" "$expected_bytes" \
                  >> /tmp/cli-object-state.txt
                printf '%s\tfallback\tfallback\tfallback\t%s\n' \
                  "$artifact" "$expected_bytes" \
                  >> /tmp/cli-object-snapshot.tsv
                continue
              fi
              metadata=$(aws s3api head-object \
                --bucket "$R2_BUCKET" \
                --key "$artifact" \
                --endpoint-url "$R2_ENDPOINT")
              modified=$(jq -r '.LastModified' <<<"$metadata")
              bytes=$(jq -r '.ContentLength' <<<"$metadata")
              etag=$(jq -r '.ETag' <<<"$metadata")
              expected_bytes=$(jq -r \
                --arg artifact "$artifact" \
                '.artifacts[$artifact].size' \
                /tmp/release-expected.json)
              modified_epoch=$(date -u -d "$modified" +%s)
              if (( modified_epoch <= cutoff_epoch )) || [[ "$bytes" != "$expected_bytes" ]]; then
                printf '%s waiting modified=%s bytes=%s expected=%s\n' \
                  "$artifact" "$modified" "$bytes" "$expected_bytes" \
                  >> /tmp/cli-object-state.txt
                all_ready=false
              else
                printf '%s ready modified=%s bytes=%s\n' \
                  "$artifact" "$modified" "$bytes" \
                  >> /tmp/cli-object-state.txt
              fi
              printf '%s\tstaging\t%s\t%s\t%s\n' \
                "$artifact" "$etag" "$modified" "$bytes" \
                >> /tmp/cli-object-snapshot.tsv
            done
            cat /tmp/cli-object-state.txt
            if [[ "$all_ready" == true ]]; then
              break
            fi
            if (( $(date +%s) >= deadline )); then
              echo "::error::timed out waiting for the background R2 upload"
              exit 1
            fi
            sleep 60
          done

      - name: Download and validate the builder artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(
            codecast-darwin-arm64
            codecast-darwin-x64
            codecast-linux-arm64
            codecast-linux-x64
            codecast-windows-x64.exe
          )
          mkdir -p /tmp/cli-release
          for artifact in "${artifacts[@]}"; do
            if grep -Fxq "$artifact" /tmp/cli-fallback-ready; then
              cp "/tmp/cli-fallback/$artifact" "/tmp/cli-release/$artifact"
            else
              aws s3 cp "s3://$R2_BUCKET/$artifact" "/tmp/cli-release/$artifact" \
                --endpoint-url "$R2_ENDPOINT" \
                --no-progress
            fi
            expected_sha=$(jq -r \
              --arg artifact "$artifact" \
              '.artifacts[$artifact].sha256' \
              /tmp/release-expected.json)
            expected_bytes=$(jq -r \
              --arg artifact "$artifact" \
              '.artifacts[$artifact].size' \
              /tmp/release-expected.json)
            actual_sha=$(sha256sum "/tmp/cli-release/$artifact" | awk '{print $1}')
            actual_bytes=$(stat -c %s "/tmp/cli-release/$artifact")
            if [[ "$actual_sha" != "$expected_sha" || "$actual_bytes" != "$expected_bytes" ]]; then
              echo "::error::$artifact does not match the builder manifest"
              exit 1
            fi
          done

          assert_binary_kind() {
            local artifact=$1
            local format=$2
            local architecture=$3
            local descriptor
            descriptor=$(file -b "/tmp/cli-release/$artifact")
            if [[ "$descriptor" != *"$format"* ||
              "$descriptor" != *executable* ]]; then
              echo "::error::$artifact has unexpected file descriptor: $descriptor"
              exit 1
            fi
            if [[ "$architecture" == arm64 &&
              "$descriptor" != *arm64* &&
              "$descriptor" != *aarch64* ]]; then
              echo "::error::$artifact is not an arm64 executable: $descriptor"
              exit 1
            fi
            if [[ "$architecture" == x64 &&
              "$descriptor" != *x86-64* &&
              "$descriptor" != *x86_64* ]]; then
              echo "::error::$artifact is not an x64 executable: $descriptor"
              exit 1
            fi
            echo "$artifact: $descriptor"
          }
          assert_binary_kind codecast-darwin-arm64 'Mach-O 64-bit' arm64
          assert_binary_kind codecast-darwin-x64 'Mach-O 64-bit' x64
          assert_binary_kind codecast-linux-arm64 'ELF 64-bit' arm64
          assert_binary_kind codecast-linux-x64 'ELF 64-bit' x64
          assert_binary_kind codecast-windows-x64.exe 'PE32+' x64
          chmod +x /tmp/cli-release/codecast-linux-x64
          actual_version=$(/tmp/cli-release/codecast-linux-x64 --version | tr -d '[:space:]')
          if [[ "$actual_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::linux-x64 reports version $actual_version, expected $RELEASE_VERSION"
            exit 1
          fi

          while IFS=$'\t' read -r artifact source expected_etag expected_modified expected_bytes; do
            [[ "$source" == "fallback" ]] && continue
            metadata=$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "$artifact" \
              --endpoint-url "$R2_ENDPOINT")
            actual_etag=$(jq -r '.ETag' <<<"$metadata")
            actual_modified=$(jq -r '.LastModified' <<<"$metadata")
            actual_bytes=$(jq -r '.ContentLength' <<<"$metadata")
            if [[ "$actual_etag" != "$expected_etag" ||
              "$actual_modified" != "$expected_modified" ||
              "$actual_bytes" != "$expected_bytes" ]]; then
              echo "::error::$artifact changed while the release snapshot was downloading"
              exit 1
            fi
          done < /tmp/cli-object-snapshot.tsv

      # The CI gate for a release (deploy.toml's cli target leaves it here): the
      # cut builds and signs while CI runs on the same commit, and nothing is
      # published until CI's verify job is green on it. A red or missing verdict
      # within 90 minutes fails the release before any public object is written.
      # Pushes to main share one CI group in which a newer push replaces a waiting
      # run (ci.yml's concurrency), so the source commit's own run can end
      # cancelled with no jobs. Then the verdict is a later main run's, on a commit
      # that holds the source commit: green on any of them passes, and red on the
      # newest of them fails.
      - name: Wait for CI on the source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # verify's "<status> <conclusion>" on one run, or "none" when the run has no verify job.
          verdict_of() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "verify")][0] | if . == null then "none" else "\(.status) \(.conclusion)" end'
          }
          for _ in $(seq 1 360); do
            own=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_COMMIT&event=push&per_page=5" \
              --jq '.workflow_runs | sort_by(.created_at) | last | select(. != null) | "\(.id) \(.status) \(.conclusion)"')
            if [[ -n "$own" ]]; then
              read -r run_id status conclusion <<<"$own"
              if [[ "$conclusion" != "cancelled" ]]; then
                verdict=$(verdict_of "$run_id")
                case "$verdict" in
                  "completed success") echo "CI verify is green on $SOURCE_COMMIT (run $run_id)"; exit 0 ;;
                  completed*) echo "::error::CI verify ended ${verdict#completed } on $SOURCE_COMMIT (run $run_id)"; exit 1 ;;
                esac
                # Still going, or not started: its own verdict is coming. Finished with no verify job: read later runs.
                if [[ "$status" != "completed" ]]; then sleep 15; continue; fi
              fi
            fi
            # The source commit's run was replaced, finished without jobs, or is not listed: the newest main runs on
            # commits that hold it decide (at most 5 read a pass; replaced runs are skipped).
            git fetch -q origin main
            newest=""
            green=""
            read_runs=0
            while read -r run_id sha conclusion; do
              [[ "$conclusion" == "cancelled" || "$sha" == "$SOURCE_COMMIT" ]] && continue
              git merge-base --is-ancestor "$SOURCE_COMMIT" "$sha" 2>/dev/null || continue
              verdict=$(verdict_of "$run_id")
              [[ -z "$newest" ]] && newest="$run_id $sha $verdict"
              if [[ "$verdict" == "completed success" ]]; then green="$run_id $sha"; break; fi
              read_runs=$((read_runs + 1))
              [[ "$read_runs" -ge 5 ]] && break
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=30" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[] | "\(.id) \(.head_sha) \(.conclusion)"')
            if [[ -n "$green" ]]; then
              read -r run_id sha <<<"$green"
              echo "CI verify is green on $sha, which holds $SOURCE_COMMIT (run $run_id; the source commit's own run was replaced or ran no jobs)"
              exit 0
            fi
            if [[ -n "$newest" ]]; then
              read -r run_id sha verdict <<<"$newest"
              if [[ "$verdict" == completed* ]]; then
                echo "::error::CI verify ended ${verdict#completed } on $sha, the newest main run holding $SOURCE_COMMIT (run $run_id)"
                exit 1
              fi
            fi
            sleep 15
          done
          echo "::error::CI reached no verdict on $SOURCE_COMMIT in 90 minutes"
          exit 1

      - name: Stage immutable release objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(
            codecast-darwin-arm64
            codecast-darwin-x64
            codecast-linux-arm64
            codecast-linux-x64
            codecast-windows-x64.exe
          )
          prefix="cli/releases/v$RELEASE_VERSION/$SOURCE_COMMIT"
          echo "$prefix" > /tmp/cli-release-prefix
          cp /tmp/release-expected.json /tmp/cli-release/release.json

          for artifact in "${artifacts[@]}" release.json; do
            local_file="/tmp/cli-release/$artifact"
            expected_sha=$(sha256sum "$local_file" | awk '{print $1}')
            expected_bytes=$(stat -c %s "$local_file")
            key="$prefix/$artifact"
            if metadata=$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --endpoint-url "$R2_ENDPOINT" 2>/tmp/immutable-head-error); then
              actual_sha=$(jq -r '.Metadata.sha256 // ""' <<<"$metadata")
              actual_source=$(jq -r '.Metadata["source-sha"] // ""' <<<"$metadata")
              actual_bytes=$(jq -r '.ContentLength' <<<"$metadata")
              if [[ "$actual_sha" != "$expected_sha" ||
                "$actual_source" != "$SOURCE_COMMIT" ||
                "$actual_bytes" != "$expected_bytes" ]]; then
                echo "::error::immutable object already exists with a different identity: $key"
                exit 1
              fi
              continue
            fi
            if ! grep -Eq '(404|Not Found|NoSuchKey)' /tmp/immutable-head-error; then
              cat /tmp/immutable-head-error >&2
              echo "::error::could not safely determine whether immutable object exists: $key"
              exit 1
            fi
            aws s3 cp "$local_file" "s3://$R2_BUCKET/$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/octet-stream \
              --cache-control "public, max-age=31536000, immutable" \
              --metadata "sha256=$expected_sha,version=$RELEASE_VERSION,source-sha=$SOURCE_COMMIT" \
              --no-progress
          done

      - name: Verify immutable public release bytes
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(
            codecast-darwin-arm64
            codecast-darwin-x64
            codecast-linux-arm64
            codecast-linux-x64
            codecast-windows-x64.exe
            release.json
          )
          prefix=$(cat /tmp/cli-release-prefix)
          mkdir -p /tmp/cli-public
          # All six at once. A stalled transfer (under 100 kB/s for 30s) is
          # dropped and retried rather than held to the 15 minute cap, which
          # one release spent waiting on a single download.
          verify_one() {
            local artifact="$1" expected actual
            expected=$(sha256sum "/tmp/cli-release/$artifact" | awk '{print $1}')
            for attempt in $(seq 1 10); do
              if curl -fsSL \
                --retry 3 --retry-all-errors \
                --connect-timeout 20 --max-time 900 \
                --speed-limit 100000 --speed-time 30 \
                -H 'Cache-Control: no-cache' \
                "https://dl.codecast.sh/$prefix/$artifact" \
                -o "/tmp/cli-public/$artifact"; then
                actual=$(sha256sum "/tmp/cli-public/$artifact" | awk '{print $1}')
                [[ "$actual" == "$expected" ]] && return 0
              fi
              sleep 15
            done
            echo "::error::$artifact immutable public checksum did not converge"
            return 1
          }
          pids=()
          for artifact in "${artifacts[@]}"; do
            verify_one "$artifact" & pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          exit "$failed"

      - name: Revalidate main and atomically publish version commit and tag
        id: version_commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout main
          git pull --ff-only origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tag names exactly what the binaries hold: SOURCE_COMMIT plus the
          # version bump, as a commit whose parent is SOURCE_COMMIT. Main's head may
          # carry later CLI commits the release does not, so main gets its own bump
          # commit and the tag never points at it (ct-102056).
          tag="v$RELEASE_VERSION"
          created_tag=false
          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            release_sha=$(git rev-parse "$tag^{commit}")
            tag_version=$(git show "$release_sha:packages/cli/package.json" | jq -r '.version')
            tag_changes=$(git diff --name-only "$SOURCE_COMMIT" "$release_sha")
            if [[ "$(git rev-parse "$release_sha^")" != "$SOURCE_COMMIT" ||
              "$tag_version" != "$RELEASE_VERSION" ||
              "$tag_changes" != "packages/cli/package.json" ]]; then
              echo "::error::$tag at $release_sha is not $SOURCE_COMMIT plus the $RELEASE_VERSION bump"
              exit 1
            fi
          else
            mode=$(git ls-tree "$SOURCE_COMMIT" packages/cli/package.json | awk '{print $1}')
            blob=$(git show "$SOURCE_COMMIT:packages/cli/package.json" |
              jq --arg version "$RELEASE_VERSION" '.version = $version' |
              git hash-object -w --stdin)
            export GIT_INDEX_FILE=/tmp/release-index
            git read-tree "$SOURCE_COMMIT"
            git update-index --cacheinfo "$mode,$blob,packages/cli/package.json"
            tree=$(git write-tree)
            unset GIT_INDEX_FILE
            release_sha=$(git commit-tree "$tree" -p "$SOURCE_COMMIT" \
              -m "chore(cli): release $RELEASE_VERSION")
            git tag -a "$tag" "$release_sha" -m "Codecast CLI $RELEASE_VERSION"
            created_tag=true
          fi

          current=$(jq -r '.version' packages/cli/package.json)
          refs=()
          if [[ "$current" == "$PREVIOUS_VERSION" ]]; then
            jq --arg version "$RELEASE_VERSION" '.version = $version' \
              packages/cli/package.json > /tmp/cli-package.json
            mv /tmp/cli-package.json packages/cli/package.json
            git add packages/cli/package.json
            git commit -m "chore(cli): bump version to $RELEASE_VERSION"
            refs+=(HEAD:main)
          elif [[ "$current" != "$RELEASE_VERSION" ]]; then
            echo "::error::main package version changed to unexpected $current"
            exit 1
          fi
          if [[ "$created_tag" == true ]] ||
            ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            refs+=("refs/tags/$tag")
          fi
          if (( ${#refs[@]} )); then
            git push --atomic origin "${refs[@]}"
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Release commit: \`$release_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or verify GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(
            codecast-darwin-arm64
            codecast-darwin-x64
            codecast-linux-arm64
            codecast-linux-x64
            codecast-windows-x64.exe
          )
          tag="v$RELEASE_VERSION"
          # Why: the release is born a draft so that publishing it is one later
          # step, gated on the draft assertion and the required assets check.
          # A release created public is visible while its assets still upload,
          # and nothing can tell a half-uploaded release from a finished one
          # (ct-49566). gh resolves a draft by tag name, so every verb below
          # works unchanged.
          created_draft=false
          if ! gh release view "$tag" >/dev/null 2>&1; then
            files=()
            for artifact in "${artifacts[@]}"; do
              files+=("/tmp/cli-release/$artifact")
            done
            gh release create "$tag" "${files[@]}" \
              --draft \
              --verify-tag \
              --generate-notes
            created_draft=true
          fi
          echo "created_draft=$created_draft" >> "$GITHUB_OUTPUT"

          for artifact in "${artifacts[@]}"; do
            expected_sha=$(sha256sum "/tmp/cli-release/$artifact" | awk '{print $1}')
            expected_digest="sha256:$expected_sha"
            asset_name=$(gh release view "$tag" --json assets --jq \
              ".assets[] | select(.name == \"$artifact\") | .name")
            if [[ -z "$asset_name" ]]; then
              gh release upload "$tag" "/tmp/cli-release/$artifact"
            fi

            digest=""
            for attempt in $(seq 1 10); do
              digest=$(gh release view "$tag" --json assets --jq \
                ".assets[] | select(.name == \"$artifact\") | .digest")
              [[ -n "$digest" ]] && break
              sleep 3
            done
            if [[ -z "$digest" ]]; then
              verify_dir="/tmp/cli-github/$artifact"
              mkdir -p "$verify_dir"
              gh release download "$tag" \
                --pattern "$artifact" \
                --dir "$verify_dir"
              downloaded_sha=$(sha256sum "$verify_dir/$artifact" | awk '{print $1}')
              if [[ "$downloaded_sha" != "$expected_sha" ]]; then
                echo "::error::$tag asset $artifact has unexpected downloaded bytes"
                exit 1
              fi
              digest="$expected_digest"
            fi
            if [[ "$digest" != "$expected_digest" ]]; then
              echo "::error::$tag asset $artifact has digest $digest, expected $expected_digest"
              exit 1
            fi
          done

          release_state=$(gh release view "$tag" --json isPrerelease)
          if [[ "$(jq -r '.isPrerelease' <<<"$release_state")" != "false" ]]; then
            echo "::error::$tag unexpectedly exists as a prerelease"
            exit 1
          fi

      - name: Verify the release is still a draft
        # Why: this workflow owns the one draft -> published transition. If the
        # release it created is already public, something else published it and
        # the bytes behind it were never checked (ct-49566).
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED_DRAFT: ${{ steps.github_release.outputs.created_draft }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          # The tags endpoint cannot see drafts; the list can.
          releases_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          draft="$(jq -e -r --arg tag "$tag" '
            map(select(.tag_name == $tag))
            | if length == 1 and (.[0].draft | type) == "boolean"
              then (.[0].draft | tostring) else empty end
          ' <<<"$releases_json")" || {
            echo "::error::$tag was not found exactly once in the draft-aware releases list"
            exit 1
          }
          if [[ "$draft" == "true" ]]; then
            echo "$tag is still a draft"
          elif [[ "$CREATED_DRAFT" == "true" ]]; then
            echo "::error::$tag was created as a draft by this run and published by something else"
            exit 1
          else
            echo "::notice::$tag was already published before this run; its assets were verified above"
          fi

      - name: Verify every required release asset is present
        # Why: publishing a release that is missing a platform points clients at
        # a download that does not exist (ct-49566).
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bun scripts/ci/verify-release-required-assets.ts "v$RELEASE_VERSION"

      - name: Publish the GitHub release
        # Why: the only draft -> published transition, and it runs after both
        # checks above, before latest.json points anyone at these bytes.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          release_state=$(gh release view "$tag" --json isDraft,isPrerelease)
          if [[ "$(jq -r '.isDraft' <<<"$release_state")" == "true" ]]; then
            gh release edit "$tag" --draft=false
            release_state=$(gh release view "$tag" --json isDraft,isPrerelease)
          fi
          if [[ "$(jq -r '.isDraft' <<<"$release_state")" != "false" ]]; then
            echo "::error::$tag did not converge to a published release"
            exit 1
          fi
          if [[ "$(jq -r '.isPrerelease' <<<"$release_state")" != "false" ]]; then
            echo "::error::$tag unexpectedly became a prerelease"
            exit 1
          fi

      - name: Publish latest.json last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(cat /tmp/cli-release-prefix)
          aws s3 cp "s3://$R2_BUCKET/latest.json" /tmp/current-r2-latest.json \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress
          current_public=$(curl -fsSL \
            --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -H 'Cache-Control: no-cache' \
            "https://dl.codecast.sh/latest.json")
          current_r2_version=$(jq -r '.version' /tmp/current-r2-latest.json)
          current_public_version=$(jq -r '.version' <<<"$current_public")
          if [[ "$current_public_version" != "$current_r2_version" ]]; then
            echo "::error::public and authoritative latest.json versions disagree"
            exit 1
          fi
          current_version="$current_r2_version"
          if [[ "$current_version" == "$RELEASE_VERSION" ]]; then
            released=$(jq -r '.released' /tmp/current-r2-latest.json)
          elif [[ "$current_version" == "$PREVIOUS_VERSION" ]]; then
            released=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          else
            echo "::error::refusing to overwrite unexpected public version $current_version"
            exit 1
          fi

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg released "$released" \
            --arg source "$SOURCE_COMMIT" \
            --arg prefix "https://dl.codecast.sh/$prefix" \
            --slurpfile expected /tmp/release-expected.json \
            '{
              version: $version,
              released: $released,
              sourceCommit: $source,
              binaries: {
                "darwin-arm64": {
                  url: ($prefix + "/codecast-darwin-arm64"),
                  sha256: $expected[0].artifacts["codecast-darwin-arm64"].sha256
                },
                "darwin-x64": {
                  url: ($prefix + "/codecast-darwin-x64"),
                  sha256: $expected[0].artifacts["codecast-darwin-x64"].sha256
                },
                "linux-arm64": {
                  url: ($prefix + "/codecast-linux-arm64"),
                  sha256: $expected[0].artifacts["codecast-linux-arm64"].sha256
                },
                "linux-x64": {
                  url: ($prefix + "/codecast-linux-x64"),
                  sha256: $expected[0].artifacts["codecast-linux-x64"].sha256
                },
                "windows-x64": {
                  url: ($prefix + "/codecast-windows-x64.exe"),
                  sha256: $expected[0].artifacts["codecast-windows-x64.exe"].sha256
                }
              }
            }' > /tmp/cli-release/latest.json

          # The previous signature goes first, so the only gap a client can
          # see is "unsigned" (refused for one poll, retried on the next),
          # never a signature over other bytes. The sign step below uploads
          # the new signature.
          aws s3 rm "s3://$R2_BUCKET/latest.json.sig" --endpoint-url "$R2_ENDPOINT" --only-show-errors || true
          aws s3 cp /tmp/cli-release/latest.json "s3://$R2_BUCKET/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata "version=$RELEASE_VERSION,source-sha=$SOURCE_COMMIT" \
            --no-progress

      # Detached Ed25519 signature over the exact bytes just published. Clients
      # refuse a latest.json that no pinned key signed
      # (docs/architecture/release-signing.md), so a missing key fails the run.
      - name: Sign latest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RELEASE_MANIFEST_SIGNING_KEY: ${{ secrets.RELEASE_MANIFEST_SIGNING_KEY }}
          RELEASE_MANIFEST_KEY_ID: ${{ secrets.RELEASE_MANIFEST_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_MANIFEST_SIGNING_KEY:-}" || -z "${RELEASE_MANIFEST_KEY_ID:-}" ]]; then
            echo "::error::no release manifest signing key configured; clients refuse the unsigned latest.json"
            exit 1
          fi
          bun platform/packages/cli-kit/release/sign-manifest.ts \
            --manifest /tmp/cli-release/latest.json \
            --key-id "$RELEASE_MANIFEST_KEY_ID" \
            --out /tmp/cli-release/latest.json.sig
          aws s3 cp /tmp/cli-release/latest.json.sig "s3://$R2_BUCKET/latest.json.sig" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata "version=$RELEASE_VERSION,source-sha=$SOURCE_COMMIT" \
            --no-progress

      - name: Verify the exact public manifest and referenced bytes
        shell: bash
        run: |
          set -euo pipefail
          expected_manifest_sha=$(sha256sum /tmp/cli-release/latest.json | awk '{print $1}')
          matched=false
          for attempt in $(seq 1 20); do
            if curl -fsSL \
              --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              -H 'Cache-Control: no-cache' \
              "https://dl.codecast.sh/latest.json" \
              -o /tmp/cli-public/latest.json; then
              actual_manifest_sha=$(sha256sum /tmp/cli-public/latest.json | awk '{print $1}')
              if [[ "$actual_manifest_sha" == "$expected_manifest_sha" ]]; then
                matched=true
                break
              fi
            fi
            sleep 15
          done
          if [[ "$matched" != true ]]; then
            echo "::error::public latest.json did not converge to the exact release manifest"
            exit 1
          fi

          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64; do
            url=$(jq -r --arg platform "$platform" '.binaries[$platform].url' \
              /tmp/cli-public/latest.json)
            expected=$(jq -r --arg platform "$platform" '.binaries[$platform].sha256' \
              /tmp/cli-public/latest.json)
            filename=$(basename "$url")
            actual=$(sha256sum "/tmp/cli-public/$filename" | awk '{print $1}')
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$platform referenced checksum does not match verified public bytes"
              exit 1
            fi
          done

          {
            echo "### CLI $RELEASE_VERSION release"
            echo
            echo "- Source: \`$SOURCE_COMMIT\`"
            echo "- Manifest: \`$expected_manifest_sha\`"
            echo "- Immutable public URLs: verified"
            echo "- GitHub release assets: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh legacy stable aliases
        continue-on-error: true
        timeout-minutes: 3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(
            codecast-darwin-arm64
            codecast-darwin-x64
            codecast-linux-arm64
            codecast-linux-x64
            codecast-windows-x64.exe
          )
          prefix=$(cat /tmp/cli-release-prefix)
          for artifact in "${artifacts[@]}"; do
            expected=$(sha256sum "/tmp/cli-release/$artifact" | awk '{print $1}')
            aws s3api copy-object \
              --bucket "$R2_BUCKET" \
              --key "$artifact" \
              --copy-source "$R2_BUCKET/$prefix/$artifact" \
              --metadata-directive REPLACE \
              --metadata "sha256=$expected,version=$RELEASE_VERSION,source-sha=$SOURCE_COMMIT" \
              --content-type application/octet-stream \
              --cache-control "no-cache, no-store, must-revalidate" \
              --cli-connect-timeout 10 --cli-read-timeout 30 \
              --endpoint-url "$R2_ENDPOINT" >/dev/null
          done
