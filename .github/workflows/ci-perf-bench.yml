name: ci-perf-bench
on:
  push:
    branches: ["ci-perf/bench-**"]
jobs:
  tsc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tsconfig:
          - packages/cli/tsconfig.typecheck.json
          - packages/web/tsconfig.json
          - packages/convex/convex/tsconfig.json
          - packages/web/store/__tests__/sim/tsconfig.json
          - packages/evals/tsconfig.json
          - packages/playground/tsconfig.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: tsc 5
        env: { NODE_OPTIONS: --max-old-space-size=6144 }
        run: |
          s=$(date +%s); node_modules/.bin/tsc --noEmit -p ${{ matrix.tsconfig }} > /tmp/t5.txt 2>&1; rc=$?; e=$(date +%s)
          echo "TSC5 rc=$rc secs=$((e-s)) errors=$(grep -c 'error TS' /tmp/t5.txt)"
      - name: tsc 7
        run: |
          npm i --prefix /tmp/ts7 typescript@7.0.2 >/dev/null 2>&1
          s=$(date +%s); /tmp/ts7/node_modules/.bin/tsc --noEmit -p ${{ matrix.tsconfig }} > /tmp/t7.txt 2>&1; rc=$?; e=$(date +%s)
          echo "TSC7 rc=$rc secs=$((e-s)) errors=$(grep -c 'error TS' /tmp/t7.txt)"
          grep -oE 'error TS[0-9]+' /tmp/t7.txt | sort | uniq -c | sort -rn | head -20
          head -60 /tmp/t7.txt
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [nocache, cache, nocache2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.4" }
      - if: matrix.variant == 'cache'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install
        run: |
          s=$(date +%s); bun install --frozen-lockfile; e=$(date +%s); echo "INSTALL secs=$((e-s))"
          du -sh ~/.bun/install/cache node_modules 2>/dev/null
