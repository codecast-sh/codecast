name: Set up bun
description: >
  Bun at the version CI pins and the workspace install. The one place a bun
  bump lands for every CI job. No install cache: restoring it (950 MB) took
  24s, and a cold `bun install` from the registry takes 10 to 15s.
inputs:
  deps:
    description: >
      "install" runs `bun install` at the repo root; "cache" and "none" set
      up bun alone, for a job that installs on its own or has no dependencies.
    default: install
  bun-version:
    description: >
      The bun a job runs on: the version the repo pins, unless the job names its own.
    default: "1.4.4"
runs:
  using: composite
  steps:
    # Under --isolate this bun must run a test preload in every file: the web
    # suite's mocks hand each file the first file's modules otherwise.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - if: inputs.deps == 'install'
      name: Install dependencies
      shell: bash
      run: bun install
