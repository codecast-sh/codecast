name: Set up bun
description: >
  Bun at the version CI pins, the bun install cache, and the workspace
  install. The one place a bun bump lands for every CI job.
inputs:
  deps:
    description: >
      "install" restores the cache and runs `bun install` at the repo root;
      "cache" restores the cache for a job that installs on its own; "none"
      sets up bun alone, for a job with no dependencies.
    default: install
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.13

    - if: inputs.deps != 'none'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - if: inputs.deps == 'install'
      name: Install dependencies
      shell: bash
      run: bun install
