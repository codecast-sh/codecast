# This repository's deploy targets (docs/architecture/deploys.md DP10): the places
# its code goes live. The Deploys page shows what runs on each and the commits on
# main waiting for it (those touching its `when` paths), and Deploy sends it from
# this checkout.
#
#   ship      the [[ship.deploy]] step in workspace.toml that sends it at a ship;
#             the target takes that step's run and when
#   run       the command that sends it, from the checkout root ($sha, $deploy, $actor)
#   runs      here (this checkout runs `run`, the default) or push (it deploys
#             itself when main moves)
#   live      how codecast reads what runs there: marker (the deploy path records
#             it), github-status:<context>, or json:<url>#<sha field>[,<version field>]
#   rollback  the command that puts the previous version back
#   policy    press (a person sends it by name, the default), release (it also goes out
#             with every release: `cast deploy`, and a change flow's Deploy stage when
#             the change touches it) or auto (the server sends it when CI on main is green)
#   after     targets that must be live with the same commit first
#   ci        before the send: the deploy sha's CI verdict
#   gate      after the send: the gate's verdict on what went out
#   rollout   after the gate: the rollout finishing (a run's jobs: cast line deploy follow --jobs <names>)
#   finish    once live: what follows the deploy ($version is what went out)
#   deadline  how long a change flow's Deploy stage waits for it to go live, from when it
#             can first go out, before it calls the deploy stuck (30m, 1h30m; at most 24h).
#             Default a day for a press target or the line's own, which the run only waits
#             on, 60m for a release target it sends, 30m for a push or auto target
#
# These live apart from workspace.toml because every released CLI validates that
# file strictly and refuses keys it does not know.

[[target]]
name = "backend"
ship = "convex"
live = "marker"                       # deploy.sh and the ship record each deploy
policy = "release"

# Railway builds every push to main and posts a commit status per deploy.
[[target]]
name = "web"
runs = "push"
when = ["packages/web/**", "packages/shared/**", "platform/**"]
live = "github-status:codecast - web"

# Cut in CI once CI on the commit is green; live once dl.codecast.sh/latest.json names
# the commit (CLAUDE.md, CLI releases). Then every machine is made to update to it.
[[target]]
name = "cli"
when = ["packages/cli/**", "packages/shared/**", "platform/**"]
run = "scripts/cut-cli-release.sh"
live = "json:https://dl.codecast.sh/latest.json#sourceCommit,version"
policy = "release"
ci = "cast line deploy ci --workflow ci.yml"
finish = "cast force-update $version"

# An OTA update to every channel, after the backend it calls is live. The app bundles
# shared and web code too, so those paths ship it.
[[target]]
name = "mobile"
when = ["packages/mobile/**", "packages/shared/**", "packages/web/**", "platform/**"]
run = "packages/mobile/scripts/ota.sh $sha"
policy = "release"
after = ["backend"]

[[target]]
name = "desktop"
when = ["packages/electron/**"]
run = "packages/electron/scripts/release.sh patch --no-floor"
