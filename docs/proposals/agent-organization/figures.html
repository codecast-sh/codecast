<template id="figure-delegation">
<figure class="flow-figure"><figcaption><strong>From approved intent to verified outcome</strong> Each step has a durable record and a visible failure state.</figcaption>
<ol class="flow-steps"><li><b>1 · Scope</b><span>Confirm task, owner, criteria and allowed effects.</span></li><li><b>2 · Admit</b><span>Claim attempt and reserve resources in one transaction.</span></li><li><b>3 · Run</b><span>Dispatch the operation; confirm the process receipt.</span></li><li><b>4 · Review</b><span>Submit revision and evidence; independent check where required.</span></li><li><b>5 · Accept</b><span>Record the verified outcome. Separate release approval remains explicit.</span></li></ol>
<div class="flow-return">At every step: show the next actor, preserve useful work, reconcile uncertainty before retrying.</div>
</figure>
</template>

<template id="figure-lifecycle">
<figure class="flow-figure"><figcaption><strong>A lead survives its current session</strong> Process state and responsibility are separate.</figcaption>
<div class="lifecycle-grid"><div><span class="state">Active</span><b>Session 12</b><p>Current generation can coordinate authorized work.</p></div><div class="lifecycle-arrow" aria-hidden="true">→</div><div><span class="state warning">Vacant</span><b>No active coordinator</b><p>Work and evidence remain. Eligible decisions escalate.</p></div><div class="lifecycle-arrow" aria-hidden="true">→</div><div><span class="state">Active</span><b>Session 13</b><p>New generation reconciles durable state before dispatch.</p></div></div>
<p class="figure-note">The role ID and original launch provenance stay unchanged. Old sessions cannot regain authority by resuming.</p>
</figure>
</template>
