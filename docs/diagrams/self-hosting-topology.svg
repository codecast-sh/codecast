<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="t d">
  <title id="t">Self-hosted codecast topology</title>
  <desc id="d">A Railway project from the convex-w-reverse-proxy template runs four services: caddy-proxy on the public domain, convex-backend with HTTP actions on port 3211 and the backend on port 3210, the Convex dashboard on 6791 and Postgres on 5432. Caddy sends /cli, /.well-known, /api/auth, /api/public, /api/webhooks and /api/github-app to the HTTP actions and everything else to the backend. A separate Railway service runs the Hono web server that serves the SPA. Browsers, the desktop and mobile apps, each user's cast daemon and incoming webhooks all reach Convex through Caddy. packages/convex/deploy.sh pushes functions through the same proxy with the admin key.</desc>
  <style>
    .page { fill: #FBF5E2 }
    .card { fill: #ffffff; stroke: #93a1a1; stroke-width: 1.25 }
    .inset { fill: #eee8d5; stroke: none }
    .zone { fill: none; stroke: #93a1a1; stroke-width: 1; stroke-dasharray: 3 4 }
    .agent { fill: #ffffff; stroke: #6c71c4; stroke-width: 1.25 }
    .core { fill: #ffffff; stroke: #2aa198; stroke-width: 1.75 }
    text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #002b36 }
    .h { font-size: 15px; font-weight: 600 }
    .l { font-size: 12px }
    .n { font-size: 11px; fill: #586e75 }
    .k { font-size: 10px; fill: #93a1a1; letter-spacing: .04em }
    .data { stroke: #2aa198; stroke-width: 1.5; fill: none }
    .cmd { stroke: #268bd2; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4 }
    .dataLbl { fill: #2aa198 }
    .cmdLbl { fill: #268bd2 }
    .ah-data { fill: #2aa198 }
    .ah-cmd { fill: #268bd2 }
    .person { fill: #cb4b16 }
    @media (prefers-color-scheme: dark) {
      .page { fill: #002b36 }
      .card, .agent, .core { fill: #08404e }
      .card { stroke: #586e75 }
      .inset { fill: #073642 }
      .zone { stroke: #586e75 }
      text { fill: #fdf6e3 }
      .n { fill: #93a1a1 }
      .k { fill: #657b83 }
      .dataLbl { fill: #2aa198 }
      .cmdLbl { fill: #268bd2 }
    }
  </style>
  <defs>
    <marker id="aData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-data" d="M0 0L10 5L0 10z"/></marker>
    <marker id="aCmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-cmd" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="page" width="960" height="590" rx="12"/>

  <!-- Clients -->
  <text class="h" x="24" y="52">Clients</text>
  <g class="l">
    <rect class="card" x="24" y="70" width="200" height="44" rx="8"/><text x="38" y="89">browser</text><text class="n" x="38" y="105">loads the SPA</text>
    <rect class="card" x="24" y="130" width="200" height="44" rx="8"/><text x="38" y="149">desktop app</text><text class="n" x="38" y="165">Electron, CODECAST_URL</text>
    <rect class="card" x="24" y="190" width="200" height="44" rx="8"/><text x="38" y="209">mobile app</text><text class="n" x="38" y="225">EXPO_PUBLIC_CONVEX_URL</text>
    <rect class="agent" x="24" y="250" width="200" height="44" rx="8"/><text x="38" y="269">cast daemon</text><text class="n" x="38" y="285">one per user machine</text>
    <rect class="card" x="24" y="330" width="200" height="60" rx="8"/><text x="38" y="350">webhooks</text><text class="n" x="38" y="366">GitHub, Linear, Slack,</text><text class="n" x="38" y="380">Sentry, OAuth callbacks</text>
  </g>

  <!-- client bus into caddy -->
  <path class="data" d="M224 104 H250 M224 152 H250 M224 212 H250 M224 272 H250 M224 360 H250 M250 104 V360"/>
  <path class="data" d="M250 300 H286" marker-end="url(#aData)"/>

  <!-- Web server -->
  <rect class="card" x="300" y="60" width="280" height="68" rx="8"/>
  <text class="l" x="314" y="82">web server (Railway service)</text>
  <text class="n" x="314" y="100">Hono + the SPA, packages/web</text>
  <text class="n" x="314" y="116">yourdomain.com</text>
  <path class="data" d="M300 86 H228" marker-end="url(#aData)"/>
  <text class="l dataLbl" x="250" y="78">app</text>

  <!-- Railway project -->
  <rect class="zone" x="260" y="156" width="676" height="364" rx="12"/>
  <text class="k" x="276" y="178">RAILWAY PROJECT, FROM THE convex-w-reverse-proxy TEMPLATE</text>

  <!-- Caddy -->
  <rect class="core" x="290" y="196" width="250" height="208" rx="10"/>
  <text class="l" x="306" y="218">caddy-proxy</text>
  <text class="n" x="306" y="236">convex.yourdomain.com</text>
  <text class="k" x="306" y="262">TO 3211, HTTP ACTIONS</text>
  <text class="n" x="306" y="280">/cli/*  /.well-known/*</text>
  <text class="n" x="306" y="296">/api/auth/*  /api/public/*</text>
  <text class="n" x="306" y="312">/api/webhooks/*</text>
  <text class="n" x="306" y="328">/api/github-app/*</text>
  <text class="k" x="306" y="354">TO 3210, EVERYTHING ELSE</text>
  <text class="n" x="306" y="372">functions, sync, deploy API</text>
  <text class="n" x="306" y="388">/api/storage/* cached</text>

  <!-- Backend -->
  <rect class="core" x="600" y="196" width="310" height="164" rx="10"/>
  <text class="h" x="616" y="222">convex-backend</text>
  <rect class="inset" x="616" y="240" width="278" height="46" rx="5"/>
  <text class="l" x="628" y="259">3211 HTTP actions</text>
  <text class="n" x="628" y="276">cli endpoints, webhooks, auth</text>
  <rect class="inset" x="616" y="294" width="278" height="46" rx="5"/>
  <text class="l" x="628" y="313">3210 backend</text>
  <text class="n" x="628" y="330">functions, live subscriptions</text>

  <path class="data" d="M540 263 H612" marker-end="url(#aData)"/>
  <path class="data" d="M540 317 H612" marker-end="url(#aData)"/>

  <!-- Postgres and dashboard -->
  <rect class="card" x="600" y="430" width="140" height="62" rx="8"/>
  <text class="l" x="614" y="454">postgres</text>
  <text class="n" x="614" y="472">5432, storage</text>
  <rect class="card" x="770" y="430" width="140" height="62" rx="8"/>
  <text class="l" x="784" y="454">dashboard</text>
  <text class="n" x="784" y="472">6791, admin key</text>
  <path class="data" d="M670 360 V426" marker-end="url(#aData)"/>
  <path class="cmd" d="M840 430 V364" marker-end="url(#aCmd)"/>

  <!-- deploy -->
  <rect class="card" x="24" y="430" width="200" height="62" rx="8"/>
  <text class="l" x="38" y="454">deploy.sh</text>
  <text class="n" x="38" y="472">packages/convex, admin key</text>
  <path class="cmd" d="M224 461 H415 V408" marker-end="url(#aCmd)"/>

  <!-- Legend -->
  <path class="data" d="M24 548 H64" marker-end="url(#aData)"/><text class="n" x="74" y="552">data: requests, rows, live queries</text>
  <path class="cmd" d="M24 572 H64" marker-end="url(#aCmd)"/><text class="n" x="74" y="576">commands: deploys, admin actions</text>
</svg>
