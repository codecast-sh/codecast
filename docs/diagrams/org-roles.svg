<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">A role: where it reports, and what wakes it</title>
  <desc id="d">Left: the reporting tree. A role (org_roles) reports to a person or to another role through reports_to. Sessions report to a role through conversations.org_role_id, or to a person through session_owners. Each role has one standing session, reached through org_roles.anchor_id and anchors.conversation_id and marked with conversations.standing_role_id; its owners follow reports_to. Right: the only three things that wake that standing session. A recurring trigger in agent_tasks (the daily area check, the Head of People's weekly company review, the morning agenda), armed by orgRoles.ensureRoleRoutine from lib/orgRoutine.ts. An event trigger that fires when a session under the role needs input, through agentTasks.routeUpWaitingSession. And a plain pending message, sent by pendingMessages.tellRole for a chat mention, a task assignment, a handoff or a line merge, or by cast role wake.</desc>
  <style>
    .page { fill: #FBF5E2 }
    .card { fill: #ffffff; stroke: #93a1a1; stroke-width: 1.25 }
    .inset { fill: #eee8d5; stroke: none }
    .zone { fill: none; stroke: #93a1a1; stroke-width: 1; stroke-dasharray: 3 4 }
    .agent { fill: #ffffff; stroke: #6c71c4; stroke-width: 1.25 }
    .core { fill: #ffffff; stroke: #2aa198; stroke-width: 1.75 }
    .human { fill: #ffffff; stroke: #cb4b16; stroke-width: 1.5 }
    .wait { fill: #ffffff; stroke: #b58900; stroke-width: 1.25 }
    text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #002b36 }
    .h { font-size: 15px; font-weight: 600 }
    .l { font-size: 12px }
    .n { font-size: 11px; fill: #586e75 }
    .k { font-size: 10px; fill: #93a1a1; letter-spacing: .04em }
    .data { stroke: #2aa198; stroke-width: 1.5; fill: none }
    .cmd { stroke: #268bd2; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4 }
    .tree { stroke: #93a1a1; stroke-width: 1.25; fill: none }
    .link { stroke: #6c71c4; stroke-width: 1.25; fill: none; stroke-dasharray: 2 3 }
    .dataLbl { fill: #2aa198 }
    .cmdLbl { fill: #268bd2 }
    .ah-data { fill: #2aa198 }
    .ah-cmd { fill: #268bd2 }
    .person { fill: #cb4b16 }
    @media (prefers-color-scheme: dark) {
      .page { fill: #002b36 }
      .card, .agent, .core, .human, .wait { fill: #08404e }
      .card { stroke: #586e75 }
      .inset { fill: #073642 }
      .zone { stroke: #586e75 }
      .tree { stroke: #586e75 }
      text { fill: #fdf6e3 }
      .n { fill: #93a1a1 }
      .k { fill: #657b83 }
      .dataLbl { fill: #2aa198 }
      .cmdLbl { fill: #268bd2 }
    }
  </style>
  <defs>
    <marker id="aData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-data" d="M0 0L10 5L0 10z"/></marker>
    <marker id="aCmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-cmd" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="page" width="960" height="600" rx="12"/>
  <text class="h" x="24" y="36">A role: where it reports, and what wakes it</text>

  <!-- ── Left: reporting ── -->
  <rect class="zone" x="24" y="52" width="472" height="524" rx="12"/>
  <text class="k" x="40" y="74">REPORTING (CHILD UNDER PARENT)</text>

  <!-- person -->
  <rect class="human" x="174" y="88" width="170" height="44" rx="8"/>
  <circle class="person" cx="194" cy="104" r="5"/>
  <path class="person" d="M186 120 a8 7 0 0 1 16 0 z"/>
  <text class="l" x="212" y="108">a person</text>
  <text class="n" x="212" y="124">users</text>

  <!-- tree: person to row 2 -->
  <path class="tree" d="M259 132 V156 M110 156 H415 M110 156 V176 M264 156 V176 M415 156 V176"/>

  <!-- row 2 -->
  <rect class="card" x="40" y="176" width="140" height="62" rx="8"/>
  <text class="l" x="52" y="196">Head of People</text>
  <text class="n" x="52" y="212">org_roles</text>
  <text class="n" x="52" y="228">reports_to: user</text>

  <rect class="card" x="194" y="176" width="140" height="62" rx="8"/>
  <text class="l" x="206" y="196">lead role</text>
  <text class="n" x="206" y="212">org_roles</text>
  <text class="n" x="206" y="228">reports_to: user</text>

  <rect class="agent" x="348" y="176" width="134" height="62" rx="8"/>
  <text class="l" x="360" y="196">session</text>
  <text class="n" x="360" y="212">session_owners</text>
  <text class="n" x="360" y="228">owner: the person</text>

  <!-- tree: lead to row 3 -->
  <path class="tree" d="M264 238 V264 M190 264 H344 M190 264 V290 M344 264 V290"/>

  <!-- row 3 -->
  <rect class="card" x="120" y="290" width="140" height="62" rx="8"/>
  <text class="l" x="132" y="310">sub role</text>
  <text class="n" x="132" y="326">org_roles</text>
  <text class="n" x="132" y="342">reports_to: role</text>

  <rect class="agent" x="274" y="290" width="140" height="62" rx="8"/>
  <text class="l" x="286" y="310">hand session</text>
  <text class="n" x="286" y="326">conversations</text>
  <text class="n" x="286" y="342">.org_role_id</text>

  <!-- the seat -->
  <rect class="agent" x="40" y="398" width="442" height="96" rx="8"/>
  <text class="l" x="56" y="420">every role has one standing session (its seat)</text>
  <text class="n" x="56" y="440">org_roles.anchor_id → anchors.conversation_id</text>
  <text class="n" x="56" y="456">conversations.standing_role_id = the role</text>
  <text class="n" x="56" y="472">its owners follow reports_to (stampSeatOwners)</text>

  <text class="n" x="40" y="526">A session under a role keeps its owners; the</text>
  <text class="n" x="40" y="542">role sits between it and the person. Retire</text>
  <text class="n" x="40" y="558">hands sessions and child roles back up.</text>

  <!-- ── Right: wakes ── -->
  <rect class="zone" x="512" y="52" width="424" height="524" rx="12"/>
  <text class="k" x="528" y="74">THE ONLY THINGS THAT WAKE THE SEAT</text>

  <rect class="card" x="528" y="88" width="348" height="94" rx="8"/>
  <text class="l" x="542" y="108">recurring trigger (agent_tasks)</text>
  <text class="n" x="542" y="126">"Check &lt;name&gt;'s area", daily</text>
  <text class="n" x="542" y="142">Head of People: "Company review", weekly</text>
  <text class="n" x="542" y="158">"Morning agenda" when people report to it</text>
  <text class="n" x="542" y="174">orgRoles.ensureRoleRoutine, lib/orgRoutine.ts</text>

  <rect class="card" x="528" y="196" width="348" height="78" rx="8"/>
  <text class="l" x="542" y="216">event trigger (agent_tasks)</text>
  <text class="n" x="542" y="234">"A session under you needs input"</text>
  <text class="n" x="542" y="250">agentTasks.routeUpWaitingSession</text>
  <text class="n" x="542" y="266">Head of People also: area change</text>

  <rect class="card" x="528" y="288" width="348" height="94" rx="8"/>
  <text class="l" x="542" y="308">plain message (pending_messages)</text>
  <text class="n" x="542" y="326">pendingMessages.tellRole: chat mention,</text>
  <text class="n" x="542" y="342">task assignment, handoff, line merge</text>
  <text class="n" x="542" y="358">cast role wake @handle "..."</text>
  <text class="n" x="542" y="374">(orgRoles.wake → performSessionSend)</text>

  <!-- bus into the seat -->
  <path class="cmd" d="M876 135 H904 M876 235 H904 M876 335 H904 M904 135 V412 H884" marker-end="url(#aCmd)"/>
  <text class="l cmdLbl" x="884" y="128">wake</text>

  <rect class="agent" x="528" y="398" width="352" height="96" rx="8"/>
  <text class="l" x="542" y="420">the role's standing session</text>
  <text class="n" x="542" y="440">a trigger run arrives as one frame</text>
  <text class="n" x="542" y="456">(agentTasks.triggerFrameFor);</text>
  <text class="n" x="542" y="472">a message arrives as written</text>
  <text class="n" x="542" y="488">counters.wakes +1 per line</text>

  <text class="n" x="528" y="526">A scope, charter or reports edit wakes nothing.</text>
  <text class="n" x="528" y="542">What needs a person is raised in the seat's</text>
  <text class="n" x="528" y="558">own thread: cast state, cast decide.</text>

  <!-- same session -->
  <path class="link" d="M482 446 H528"/>

  <!-- a hand waiting fires its role's event trigger -->
  <path class="cmd" d="M414 321 H500 V235 H524" marker-end="url(#aCmd)"/>
  <text class="l cmdLbl" x="420" y="312">waits</text>
</svg>
