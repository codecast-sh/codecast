<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">How a chat line reaches roles and sessions</title>
  <desc id="d">A line typed by a person or by a session goes through sendMessage in chat.ts, which enforces the agent post caps and writes the chat_messages row. Nothing about a plain line wakes anyone: a role reads the channels it follows on its own turn with cast chat read --since. A mention is the exception: resolveChatMentions resolves people, role handles and session short ids, and wakeMentionedParties checks the hourly caps in chat_agent_quota, then queues one chat-mention line into the role's standing session through tellRole or into the session through enqueuePendingMessage. Over a cap the line is stamped mention_folded and wakes nobody. When the mentioned party replies in the thread, maybeRelayToOriginSession relays the reply to the mentioning session under the same caps.</desc>
  <style>
    .page { fill: #FBF5E2 }
    .card { fill: #ffffff; stroke: #93a1a1; stroke-width: 1.25 }
    .inset { fill: #eee8d5; stroke: none }
    .zone { fill: none; stroke: #93a1a1; stroke-width: 1; stroke-dasharray: 3 4 }
    .agent { fill: #ffffff; stroke: #6c71c4; stroke-width: 1.25 }
    .core { fill: #ffffff; stroke: #2aa198; stroke-width: 1.75 }
    .human { fill: #ffffff; stroke: #cb4b16; stroke-width: 1.25 }
    .done { fill: #ffffff; stroke: #859900; stroke-width: 1.25 }
    .wait { fill: #ffffff; stroke: #b58900; stroke-width: 1.25 }
    text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #002b36 }
    .h { font-size: 15px; font-weight: 600 }
    .l { font-size: 12px }
    .b { font-weight: 600 }
    .n { font-size: 11px; fill: #586e75 }
    .k { font-size: 10px; fill: #93a1a1; letter-spacing: .04em }
    .data { stroke: #2aa198; stroke-width: 1.5; fill: none }
    .cmd { stroke: #268bd2; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4 }
    .waitLine { stroke: #b58900; stroke-width: 1.5; fill: none; stroke-dasharray: 2 3 }
    .dataLbl { fill: #2aa198 }
    .cmdLbl { fill: #268bd2 }
    .waitLbl { fill: #b58900 }
    .ah-data { fill: #2aa198 }
    .ah-cmd { fill: #268bd2 }
    .ah-wait { fill: #b58900 }
    .person { fill: #cb4b16 }
    @media (prefers-color-scheme: dark) {
      .page { fill: #002b36 }
      .card, .agent, .core, .human, .done, .wait { fill: #08404e }
      .card { stroke: #586e75 }
      .inset { fill: #073642 }
      .zone { stroke: #586e75 }
      text { fill: #fdf6e3 }
      .n { fill: #93a1a1 }
      .k { fill: #657b83 }
      .dataLbl { fill: #2aa198 }
      .cmdLbl { fill: #268bd2 }
      .waitLbl { fill: #b58900 }
    }
  </style>
  <defs>
    <marker id="aData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-data" d="M0 0L10 5L0 10z"/></marker>
    <marker id="aCmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-cmd" d="M0 0L10 5L0 10z"/></marker>
    <marker id="aWait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-wait" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="page" width="960" height="500" rx="12"/>
  <text class="h" x="24" y="36">Agent chat: who a line wakes</text>

  <!-- lane 1: pull -->
  <text class="k" x="24" y="66">PULL: A PLAIN LINE WAKES NOBODY</text>
  <rect class="inset" x="188" y="82" width="160" height="44" rx="6"/>
  <text class="l b" x="202" y="109">chat_messages</text>
  <rect class="agent" x="564" y="74" width="372" height="66" rx="8"/>
  <text class="l" x="578" y="96">a role's standing session, its own turn</text>
  <text class="n" x="578" y="114">cast chat read --channel &lt;id&gt; --since 2h</text>
  <text class="n" x="578" y="130">the channels in org_roles.follow_channel_ids</text>
  <path class="cmd" d="M564 104 H352" marker-end="url(#aCmd)"/>
  <text class="n cmdLbl" x="372" y="96">chat.linesSince, at most 20</text>

  <!-- lane 2: mention -->
  <text class="k" x="24" y="186">MENTION: ONE PENDING LINE PER TARGET</text>
  <rect class="human" x="24" y="200" width="140" height="96" rx="8"/>
  <circle class="person" cx="40" cy="222" r="5"/>
  <text class="l" x="52" y="226">a person</text>
  <text class="n" x="38" y="248">or a session</text>
  <text class="n" x="38" y="264">(origin: agent)</text>
  <text class="n" x="38" y="282">posts a line</text>

  <rect class="core" x="188" y="200" width="160" height="96" rx="10"/>
  <text class="l b" x="202" y="222">sendMessage</text>
  <text class="n" x="202" y="240">chat.ts</text>
  <text class="n" x="202" y="262">agent lines: 30 a</text>
  <text class="n" x="202" y="278">day, 5 roots a day</text>
  <path class="data" d="M268 200 V130" marker-end="url(#aData)"/>
  <text class="n dataLbl" x="276" y="170">writes</text>

  <rect class="core" x="372" y="200" width="172" height="96" rx="10"/>
  <text class="l b" x="386" y="222">resolveChatMentions</text>
  <text class="n" x="386" y="240">lib/mentionResolve.ts</text>
  <text class="n" x="386" y="262">@person, @role handle,</text>
  <text class="n" x="386" y="278">@jx… session short id</text>

  <rect class="core" x="568" y="200" width="184" height="96" rx="10"/>
  <text class="l b" x="582" y="222">wakeMentionedParties</text>
  <text class="n" x="582" y="240">caps in chat_agent_quota</text>
  <text class="n" x="582" y="262">10 an hour per sender,</text>
  <text class="n" x="582" y="278">30 an hour per target</text>

  <path class="data" d="M164 248 H184" marker-end="url(#aData)"/>
  <path class="data" d="M348 248 H368" marker-end="url(#aData)"/>
  <path class="data" d="M544 248 H564" marker-end="url(#aData)"/>

  <rect class="agent" x="772" y="190" width="164" height="62" rx="8"/>
  <text class="l b" x="786" y="209">a role</text>
  <text class="n" x="786" y="227">tellRole, into its</text>
  <text class="n" x="786" y="242">standing session</text>
  <rect class="agent" x="772" y="262" width="164" height="48" rx="8"/>
  <text class="l b" x="786" y="281">a session</text>
  <text class="n" x="786" y="299">enqueuePendingMessage</text>
  <text class="n" x="772" y="330">each a &lt;chat-mention&gt;</text>
  <path class="cmd" d="M752 221 H768" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M752 284 H768" marker-end="url(#aCmd)"/>

  <path class="waitLine" d="M660 296 V318" marker-end="url(#aWait)"/>
  <rect class="wait" x="568" y="322" width="184" height="48" rx="8"/>
  <text class="n" x="582" y="342">over a cap: no wake,</text>
  <text class="n" x="582" y="358">stamps mention_folded</text>

  <!-- lane 3: reply relay -->
  <text class="k" x="24" y="404">REPLY: RELAYED BACK TO THE SESSION THAT ASKED</text>
  <path class="cmd" d="M920 310 V412" marker-end="url(#aCmd)"/>
  <rect class="agent" x="764" y="416" width="172" height="60" rx="8"/>
  <text class="l" x="778" y="438">the mentioned party</text>
  <text class="n" x="778" y="456">cast chat send</text>
  <text class="n" x="778" y="470">--thread &lt;root&gt;</text>

  <rect class="core" x="456" y="416" width="284" height="60" rx="10"/>
  <text class="l b" x="470" y="438">maybeRelayToOriginSession</text>
  <text class="n" x="470" y="456">buildSessionRelay; same hourly</text>
  <text class="n" x="470" y="470">caps, over a cap it folds</text>
  <path class="cmd" d="M764 446 H744" marker-end="url(#aCmd)"/>

  <rect class="agent" x="188" y="416" width="244" height="60" rx="8"/>
  <text class="l" x="202" y="438">the mentioning session</text>
  <text class="n" x="202" y="456">gets the answer as a</text>
  <text class="n" x="202" y="470">session message</text>
  <path class="cmd" d="M456 446 H436" marker-end="url(#aCmd)"/>
</svg>
