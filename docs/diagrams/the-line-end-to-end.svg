<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">The line, end to end: from a signal to a shipped, watched change</title>
  <desc id="d">Top row, in Convex: finders (Sentry, PostHog, evals, AgentWatch, insights, org health, lessons, a person with cast signal add) write through one door, signals.ingest, which attaches each signal to a cause by fingerprint, else by a judge call, else as a new cause, a tasks row with source signal. The lineGround.sweep cron grounds each new cause every two minutes: goal_ref, category, risk and readiness. A run is admitted with cast workflow run --task, which runs the role's line or the shipped one; the orgLine.sweep admission cron is off. Middle row: one run of the line.cast workflow, node by node: ground, plan gate when risk is plan, analyze, prove, red, implement, verify, green, eval, review, card. Bottom row: the card becomes a decide gate, a session_decisions row the person answers Ship, Revise or Drop. Ship runs the profile's ship command or cast line merge, then the cause is watched through tasks.watch_until until signals.sweepWatches closes it quiet or a new signal reopens it. A Revise or Drop note goes to lineLearn, which writes a lesson signal back through the door.</desc>
  <style>
    .page { fill: #FBF5E2 }
    .card { fill: #ffffff; stroke: #93a1a1; stroke-width: 1.25 }
    .inset { fill: #eee8d5; stroke: none }
    .zone { fill: none; stroke: #93a1a1; stroke-width: 1; stroke-dasharray: 3 4 }
    .agent { fill: #ffffff; stroke: #6c71c4; stroke-width: 1.25 }
    .core { fill: #ffffff; stroke: #2aa198; stroke-width: 1.75 }
    .human { fill: #ffffff; stroke: #cb4b16; stroke-width: 1.5 }
    .ok { fill: #ffffff; stroke: #859900; stroke-width: 1.25 }
    text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #002b36 }
    .h { font-size: 15px; font-weight: 600 }
    .l { font-size: 12px }
    .n { font-size: 11px; fill: #586e75 }
    .k { font-size: 10px; fill: #93a1a1; letter-spacing: .04em }
    .data { stroke: #2aa198; stroke-width: 1.5; fill: none }
    .cmd { stroke: #268bd2; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4 }
    .dataLbl { fill: #2aa198 }
    .cmdLbl { fill: #268bd2 }
    .ah-data { fill: #2aa198 }
    .ah-cmd { fill: #268bd2 }
    .person { fill: #cb4b16 }
    @media (prefers-color-scheme: dark) {
      .page { fill: #002b36 }
      .card, .agent, .core, .human, .ok { fill: #08404e }
      .card { stroke: #586e75 }
      .inset { fill: #073642 }
      .zone { stroke: #586e75 }
      text { fill: #fdf6e3 }
      .n { fill: #93a1a1 }
      .k { fill: #657b83 }
      .dataLbl { fill: #2aa198 }
      .cmdLbl { fill: #268bd2 }
    }
  </style>
  <defs>
    <marker id="aData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-data" d="M0 0L10 5L0 10z"/></marker>
    <marker id="aCmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-cmd" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="page" width="960" height="560" rx="12"/>
  <text class="h" x="24" y="36">The line, end to end: a signal becomes one watched change</text>
  <text class="k" x="40" y="70">BEFORE A RUN (CONVEX)</text>

  <!-- ── Row 1: sense, attach, cause, ground ── -->
  <rect class="card" x="40" y="80" width="196" height="104" rx="8"/>
  <text class="l" x="52" y="100">finders</text>
  <text class="n" x="52" y="118">Sentry, PostHog, evals,</text>
  <text class="n" x="52" y="134">AgentWatch, insight,</text>
  <text class="n" x="52" y="150">org health, lesson,</text>
  <text class="n" x="52" y="166">person: cast signal add</text>

  <rect class="core" x="268" y="80" width="196" height="104" rx="8"/>
  <text class="l" x="280" y="100">signals.ingest</text>
  <text class="n" x="280" y="118">the one door; attach by</text>
  <text class="n" x="280" y="134">fingerprint, else judge,</text>
  <text class="n" x="280" y="150">else a new cause</text>
  <text class="n" x="280" y="166">writes a signals row</text>

  <rect class="card" x="496" y="80" width="196" height="104" rx="8"/>
  <text class="l" x="508" y="100">cause</text>
  <text class="n" x="508" y="118">a tasks row,</text>
  <text class="n" x="508" y="134">source: "signal"</text>
  <text class="n" x="508" y="150">cause.signal_count,</text>
  <text class="n" x="508" y="166">cause.fingerprints</text>

  <rect class="card" x="724" y="80" width="196" height="104" rx="8"/>
  <text class="l" x="736" y="100">lineGround.sweep</text>
  <text class="n" x="736" y="118">cron, every 2 min,</text>
  <text class="n" x="736" y="134">one model call writes</text>
  <text class="n" x="736" y="150">goal_ref, category,</text>
  <text class="n" x="736" y="166">risk, readiness</text>

  <path class="data" d="M236 132 H264" marker-end="url(#aData)"/>
  <path class="data" d="M464 132 H492" marker-end="url(#aData)"/>
  <path class="data" d="M692 132 H720" marker-end="url(#aData)"/>

  <!-- ── admit ── -->
  <text class="l cmdLbl" x="300" y="214">admit: cast workflow run --task ct-N</text>
  <text class="n" x="300" y="228">(the orgLine.sweep admission cron is off)</text>

  <!-- ── Row 2: one run ── -->
  <rect class="inset" x="40" y="246" width="880" height="86" rx="8"/>
  <path class="cmd" d="M822 184 V236 H86 V260" marker-end="url(#aCmd)"/>
  <text class="k" x="200" y="258">ONE RUN OF packages/cli/src/workflow/templates/line.cast</text>
  <g class="l">
    <rect class="agent" x="56" y="264" width="60" height="32" rx="8"/><text x="64" y="284">ground</text>
    <rect class="human" x="136" y="264" width="82" height="32" rx="8"/><text x="144" y="284">plan gate</text>
    <rect class="agent" x="238" y="264" width="67" height="32" rx="8"/><text x="246" y="284">analyze</text>
    <rect class="agent" x="325" y="264" width="53" height="32" rx="8"/><text x="333" y="284">prove</text>
    <rect class="card" x="398" y="264" width="38" height="32" rx="8"/><text x="406" y="284">red</text>
    <rect class="agent" x="456" y="264" width="82" height="32" rx="8"/><text x="464" y="284">implement</text>
    <rect class="card" x="558" y="264" width="60" height="32" rx="8"/><text x="566" y="284">verify</text>
    <rect class="card" x="638" y="264" width="53" height="32" rx="8"/><text x="646" y="284">green</text>
    <rect class="card" x="711" y="264" width="45" height="32" rx="8"/><text x="719" y="284">eval</text>
    <rect class="agent" x="776" y="264" width="60" height="32" rx="8"/><text x="784" y="284">review</text>
    <rect class="card" x="856" y="264" width="45" height="32" rx="8"/><text x="864" y="284">card</text>
  </g>
  <path class="cmd" d="M116 280 H132" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M218 280 H234" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M305 280 H321" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M378 280 H394" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M436 280 H452" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M538 280 H554" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M618 280 H634" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M691 280 H707" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M756 280 H772" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M836 280 H852" marker-end="url(#aCmd)"/>
  <text class="n" x="56" y="318">plan gate only when risk = plan; a failed check, eval or review goes back to implement</text>

  <!-- card to decide -->
  <path class="cmd" d="M878 296 V356 H372 V378" marker-end="url(#aCmd)"/>

  <!-- ── Row 3: the person and after ── -->
  <rect class="card" x="40" y="382" width="190" height="88" rx="8"/>
  <text class="l" x="52" y="402">learn</text>
  <text class="n" x="52" y="420">lineLearn.ts: a Revise</text>
  <text class="n" x="52" y="436">or Drop note becomes</text>
  <text class="n" x="52" y="452">a "lesson" signal</text>

  <rect class="human" x="262" y="382" width="220" height="88" rx="8"/>
  <circle class="person" cx="460" cy="396" r="5"/>
  <path class="person" d="M452 412 a8 7 0 0 1 16 0 z"/>
  <text class="l" x="274" y="402">decide gate</text>
  <text class="n" x="274" y="420">session_decisions row</text>
  <text class="n" x="274" y="436">at node "decide"</text>
  <text class="n" x="274" y="452">Ship, Revise, Drop</text>

  <rect class="ok" x="514" y="382" width="190" height="88" rx="8"/>
  <text class="l" x="526" y="402">ship</text>
  <text class="n" x="526" y="420">the profile's ship</text>
  <text class="n" x="526" y="436">command, else</text>
  <text class="n" x="526" y="452">cast line merge</text>

  <rect class="ok" x="736" y="382" width="184" height="88" rx="8"/>
  <text class="l" x="748" y="402">watch</text>
  <text class="n" x="748" y="420">tasks.watch_until</text>
  <text class="n" x="748" y="436">a new signal reopens</text>
  <text class="n" x="748" y="452">quiet: sweepWatches</text>

  <path class="cmd" d="M262 426 H234" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M482 426 H510" marker-end="url(#aCmd)"/>
  <path class="cmd" d="M704 426 H732" marker-end="url(#aCmd)"/>

  <!-- lesson back to the door -->
  <path class="data" d="M40 440 H30 V196 H366 V188" marker-end="url(#aData)"/>

  <!-- legend -->
  <path class="data" d="M40 506 H80" marker-end="url(#aData)"/><text class="n" x="90" y="510">signals and causes (rows)</text>
  <path class="cmd" d="M40 530 H80" marker-end="url(#aCmd)"/><text class="n" x="90" y="534">the run moving on: runs, nodes, gate answers</text>
  <rect class="human" x="520" y="498" width="16" height="12" rx="3"/><text class="n" x="546" y="508">a person answers</text>
  <rect class="agent" x="520" y="522" width="16" height="12" rx="3"/><text class="n" x="546" y="532">an agent session</text>
  <rect class="ok" x="700" y="498" width="16" height="12" rx="3"/><text class="n" x="726" y="508">landed</text>
</svg>
