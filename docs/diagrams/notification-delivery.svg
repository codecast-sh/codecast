<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">How one event becomes one sound or banner</title>
  <desc id="d">A window that wants to announce an event calls deliverAlert with the event's key. An agent-controlled tab stays quiet and reserves nothing. Otherwise claimBrowserAlert reserves the key in a localStorage ledger under a Web Lock, so other tabs of the same origin and profile drop it. Then the window asks the local cast daemon at /notifications/claim. The daemon answers claimed, so the window plays the sound or shows the banner; duplicate, so it drops; or desktop, when a desktop window holds a lease, so the browser asks again every second until the alert's freshness budget runs out. Desktop windows renew that lease every five seconds at /notifications/desktop.</desc>
  <style>
    .page { fill: #FBF5E2 }
    .card { fill: #ffffff; stroke: #93a1a1; stroke-width: 1.25 }
    .inset { fill: #eee8d5; stroke: none }
    .zone { fill: none; stroke: #93a1a1; stroke-width: 1; stroke-dasharray: 3 4 }
    .agent { fill: #ffffff; stroke: #6c71c4; stroke-width: 1.25 }
    .core { fill: #ffffff; stroke: #2aa198; stroke-width: 1.75 }
    .human { fill: #ffffff; stroke: #cb4b16; stroke-width: 1.25 }
    .done { fill: #ffffff; stroke: #859900; stroke-width: 1.25 }
    .wait { fill: #ffffff; stroke: #b58900; stroke-width: 1.25 }
    text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #002b36 }
    .h { font-size: 15px; font-weight: 600 }
    .l { font-size: 12px }
    .b { font-weight: 600 }
    .n { font-size: 11px; fill: #586e75 }
    .k { font-size: 10px; fill: #93a1a1; letter-spacing: .04em }
    .data { stroke: #2aa198; stroke-width: 1.5; fill: none }
    .cmd { stroke: #268bd2; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4 }
    .waitLine { stroke: #b58900; stroke-width: 1.5; fill: none; stroke-dasharray: 2 3 }
    .dataLbl { fill: #2aa198 }
    .cmdLbl { fill: #268bd2 }
    .waitLbl { fill: #b58900 }
    .ah-data { fill: #2aa198 }
    .ah-cmd { fill: #268bd2 }
    .ah-wait { fill: #b58900 }
    .person { fill: #cb4b16 }
    @media (prefers-color-scheme: dark) {
      .page { fill: #002b36 }
      .card, .agent, .core, .human, .done, .wait { fill: #08404e }
      .card { stroke: #586e75 }
      .inset { fill: #073642 }
      .zone { stroke: #586e75 }
      text { fill: #fdf6e3 }
      .n { fill: #93a1a1 }
      .k { fill: #657b83 }
      .dataLbl { fill: #2aa198 }
      .cmdLbl { fill: #268bd2 }
      .waitLbl { fill: #b58900 }
    }
  </style>
  <defs>
    <marker id="aData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-data" d="M0 0L10 5L0 10z"/></marker>
    <marker id="aCmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-cmd" d="M0 0L10 5L0 10z"/></marker>
    <marker id="aWait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-wait" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="page" width="960" height="500" rx="12"/>
  <text class="h" x="24" y="36">One event, one announcement, across windows</text>

  <!-- event -->
  <rect class="card" x="24" y="64" width="160" height="128" rx="8"/>
  <text class="l b" x="38" y="88">event key</text>
  <text class="n" x="38" y="110">sound:chat:&lt;msg&gt;</text>
  <text class="n" x="38" y="128">sound:idle:&lt;episode&gt;</text>
  <text class="n" x="38" y="146">sound:ring:&lt;call&gt;</text>
  <text class="n" x="38" y="164">banner:&lt;key&gt;</text>

  <!-- deliverAlert -->
  <rect class="core" x="208" y="64" width="216" height="128" rx="10"/>
  <text class="l b" x="222" y="88">deliverAlert</text>
  <text class="n" x="222" y="106">web lib/notificationDelivery</text>
  <text class="l" x="222" y="132">agent tab?</text>
  <text class="n" x="222" y="152">codecast-agent-tab set and</text>
  <text class="n" x="222" y="168">no codecast-agent-alerts=1</text>

  <!-- browser claim -->
  <rect class="core" x="448" y="64" width="216" height="128" rx="10"/>
  <text class="l b" x="462" y="88">claimBrowserAlert</text>
  <text class="n" x="462" y="110">Web Lock + localStorage</text>
  <text class="n" x="462" y="126">ledger: one claim per</text>
  <text class="n" x="462" y="142">origin and profile</text>
  <text class="n" x="462" y="166">scope: deployment, user,</text>
  <text class="n" x="462" y="182">workspace</text>

  <!-- daemon -->
  <rect class="core" x="688" y="64" width="248" height="128" rx="10"/>
  <text class="l b" x="702" y="88">cast daemon (loopback)</text>
  <text class="l" x="702" y="110">POST /notifications/claim</text>
  <text class="n" x="702" y="132">NotificationClaims in</text>
  <text class="n" x="702" y="148">cli/src/notificationDelivery</text>
  <text class="n" x="702" y="172">bearer + origin check</text>

  <path class="data" d="M184 128 H204" marker-end="url(#aData)"/>
  <path class="data" d="M424 128 H444" marker-end="url(#aData)"/>
  <path class="data" d="M664 128 H684" marker-end="url(#aData)"/>

  <!-- drops under the first two -->
  <path class="data" d="M316 192 V232" marker-end="url(#aData)"/>
  <text class="n dataLbl" x="324" y="216">agent tab</text>
  <rect class="card" x="208" y="236" width="216" height="56" rx="8"/>
  <text class="l" x="222" y="258">quiet</text>
  <text class="n" x="222" y="278">reserves no claim</text>

  <path class="data" d="M556 192 V232" marker-end="url(#aData)"/>
  <text class="n dataLbl" x="564" y="216">taken</text>
  <rect class="card" x="448" y="236" width="216" height="56" rx="8"/>
  <text class="l" x="462" y="258">drop</text>
  <text class="n" x="462" y="278">another tab announced it</text>

  <!-- daemon outcomes -->
  <path class="data" d="M708 192 V412"/>
  <path class="data" d="M708 262 H720" marker-end="url(#aData)"/>
  <path class="data" d="M708 330 H720" marker-end="url(#aData)"/>
  <path class="data" d="M708 412 H720" marker-end="url(#aData)"/>

  <rect class="done" x="724" y="236" width="212" height="54" rx="8"/>
  <text class="l b" x="738" y="258">claimed</text>
  <text class="n" x="738" y="278">play the sound or banner</text>

  <rect class="card" x="724" y="304" width="212" height="54" rx="8"/>
  <text class="l b" x="738" y="326">duplicate</text>
  <text class="n" x="738" y="346">another window had it</text>

  <rect class="wait" x="724" y="372" width="212" height="80" rx="8"/>
  <text class="l b" x="738" y="394">desktop</text>
  <text class="n" x="738" y="414">a desktop lease is live:</text>
  <text class="n" x="738" y="430">ask again every 1s, up</text>
  <text class="n" x="738" y="446">to min(ttl, 20s)</text>

  <!-- desktop lease -->
  <rect class="card" x="448" y="372" width="216" height="80" rx="8"/>
  <text class="l b" x="462" y="394">desktop window</text>
  <text class="n" x="462" y="414">POST /notifications/desktop</text>
  <text class="n" x="462" y="430">every 5s; lease 15s;</text>
  <text class="n" x="462" y="446">pagehide releases it</text>
  <path class="cmd" d="M664 400 H694 V196" marker-end="url(#aCmd)"/>

  <text class="n" x="24" y="380">no daemon reachable:</text>
  <text class="n" x="24" y="396">the remote answer is empty,</text>
  <text class="n" x="24" y="412">the window sends, and only</text>
  <text class="n" x="24" y="428">the browser ledger dedupes</text>
</svg>
