# Convex backend on our own hardware (plan pl-592).
#
# Two deliberate differences from how this ran on Railway:
#
# 1. THE IMAGE IS PINNED BY DIGEST, not :latest. On Railway we tracked :latest,
#    so any restart could silently carry a multi-version upgrade — that happened
#    twice unannounced (1.31.2 -> 1.36.1 on 2026-09-05, and a new binary on
#    2026-09-10 that still reported 1.36.1). Upgrades here are a deliberate edit
#    to this file, reviewed like any other change.
# 2. THE BACKEND HAS A MEMORY LIMIT well below physical RAM. It grows until it
#    is killed, roughly every one to three days, and on a shared box an
#    unbounded backend would take Postgres down with it. The limit keeps the
#    blast radius to the backend, which docker then restarts on its own —
#    something Railway did for us and a bare host will not.
services:
  backend:
    image: ghcr.io/get-convex/convex-backend@sha256:69885bae73766f625404a5425b22702341e89b43002f1d700864f8364be0d1f8
    restart: unless-stopped
    # 64 GB of a 128 GB box. Postgres gets its own budget; the OS keeps the rest
    # for page cache. Raise only after measuring growth on this hardware — more
    # headroom does not fix the growth, it only lengthens the cycle.
    mem_limit: 64g
    env_file: [.env]
    volumes:
      - /srv/convex/data:/convex/data
    ports:
      - "127.0.0.1:3210:3210"   # cloud origin (api)
      - "127.0.0.1:3211:3211"   # site origin (http actions)
    healthcheck:
      # The image is a minimal Ubuntu carrying only the convex binary: it has no
      # curl, wget, python or aws (verified 2026-09-13). It does have bash, so
      # the check opens a TCP connection through bash's /dev/tcp rather than
      # calling a binary that is not there. A curl based check would have failed
      # every time and marked a healthy backend unhealthy.
      #
      # This proves the port accepts connections, NOT that queries work. During
      # the July saturation those diverged: HTTP answered while every query
      # timed out. Real verification is the list in the cutover runbook.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3210"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }

  dashboard:
    # Pinned: every dashboard image built after 2026-03 fails on boot with
    # "Cannot find module '@radix-ui/react-icons-<hash>'" (Next 16 turbopack
    # externals), on amd64 and arm64 alike. This tag is the last build verified
    # to serve; it matches the dashboard Railway ran until decommission.
    image: ghcr.io/get-convex/convex-dashboard:46bcfa00ef626afe31cc2701636bba31fe0be5bd
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "127.0.0.1:6791:6791"
    depends_on: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: codecast/caddy-cloudflare:2
    restart: unless-stopped
    # Host networking so Caddy reaches the backend on 127.0.0.1, where the
    # backend ports are bound, and serves 80 and 443 directly.
    network_mode: host
    # CLOUDFLARE_API_TOKEN lives only on the server (mode 600), never in the repo.
    env_file: [/etc/caddy/cloudflare.env]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state. Losing this volume forces a fresh
      # issuance, which Let's Encrypt rate limits.
      - /srv/caddy/data:/data
      - /srv/caddy/config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
