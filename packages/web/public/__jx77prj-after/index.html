    <script>
      (function() {
        // The homepage is light Classic for every visitor (its hero renders the
        // real app's views, and globals.css restyles them under .dark and
        // .minimal-style); the visitor's own theme starts when the app does.
        // The same paths as lib/themeBootLock.ts, whose lock ThemeProvider starts with.
        if (location.pathname === '/') return;
        // A share link is mostly opened by people who have never used the
        // app: with no saved choice, the page follows their system.
        var saved = localStorage.getItem('codecast-theme');
        var theme = saved || (location.pathname.indexOf('/share/') === 0 && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        // A guest's meeting page (app/meet) is the call's dark room whatever
        // the system asks for: the loader before it must not flash light.
        if (location.pathname.indexOf('/meet/') === 0) theme = 'dark';
        document.documentElement.classList.add(theme);
        var visualStyle = localStorage.getItem('codecast-visual-style');
        if (visualStyle === 'minimal' || visualStyle === 'codex') {
          document.documentElement.classList.add('minimal-style');
        }
        // Hosted mode in its Minimal look (ThemeProvider stores the flag):
        // the first frame is already the family's paper, not the developer
        // default the app would correct a moment later.
        // A device last seen in hosted mode (laneBoot.ts LANE_HINT_KEY) with
        // no look stored yet, as after a first signup, starts there too.
        var hostedLook = localStorage.getItem('codecast-hosted-look');
        if (hostedLook === '1' || (hostedLook === null && localStorage.getItem('codecast-lane') === 'simple')) {
          document.documentElement.classList.add('minimal-style', 'hosted-mode');
        } else {
          // The color theme, as ThemeProvider cached it (lib/theme/colorTheme.ts),
          // or the default one when nothing is cached (plugins/colorThemeBoot.ts).
          try {
            var cachedTheme = localStorage.getItem('codecast-color-theme');
            var themeVars = (cachedTheme ? JSON.parse(cachedTheme) : window.__ccDefaultColorTheme || {})[theme] || {};
            var names = Object.keys(themeVars);
            for (var i = 0; i < names.length; i++) document.documentElement.style.setProperty(names[i], themeVars[names[i]]);
            if (names.length) document.documentElement.setAttribute('data-theme-vars', names.join(' '));
          } catch (e) {}
        }
      })();
    </script>
