<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Codecast — watch, steer, and search every agent session</title>
    <meta name="description" content="Codecast gives your team one place to watch, steer, search, and remember every AI agent session — Claude Code, Codex, Gemini, Cursor — on any machine." />
    <meta property="og:title" content="Codecast — watch, steer, and search every agent session" />
    <meta property="og:description" content="Every agent session in one place your team can watch, steer, and search — any agent, any machine." />

    <meta name="twitter:title" content="Codecast — watch, steer, and search every agent session" />
    <meta name="twitter:description" content="Every agent session in one place your team can watch, steer, and search — any agent, any machine." />
    <meta name="twitter:image" content="https://codecast.sh/logo-final.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <link

      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" />
    </noscript>
    <script>
      (function() {
        var theme = localStorage.getItem('codecast-theme') || 'light';
        document.documentElement.classList.add(theme);
      })();
    </script>
    <style>
      /* Mirrors AppLoader.tsx (monochrome mark + hairline shimmer on sol-bg) so
         the static → React handoff is invisible — change them together. */
      #boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
        background: #FBF5E2;
        color: #657b83;
        opacity: 1;
        transition: opacity 200ms ease-out;
        z-index: 2147483647;
      }
      html.dark #boot-shell { background: #002b36; }
      #boot-shell[data-hidden="true"] { opacity: 0; pointer-events: none; }
      #boot-shell .mark { opacity: 0.45; }
      #boot-shell .bar {
        position: relative;
        width: 120px;
        height: 2px;
        border-radius: 999px;
        overflow: hidden;
      }
      #boot-shell .bar::before {
        content: "";
        position: absolute;
        inset: 0;
        background: currentColor;
        opacity: 0.14;
      }
      #boot-shell .bar::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 36px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.55;
        animation: boot-loader-slide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-loader-slide {
        0% { transform: translateX(-40px); }
        100% { transform: translateX(124px); }
      }
      #root:not(:empty) ~ #boot-shell { opacity: 0; pointer-events: none; }

      /* Desktop hand-off screen. Shown when the page is sent to the desktop
         app (lib/desktopHandoff.ts showHandoffScreen): on the pre-boot path the
         app never loads, so this is plain markup revealed by one attribute on
         <html>; the React fallback (OpenInDesktopHandoff.tsx) reveals the same
         markup. Opaque on purpose — nothing behind it should show. */
      #cc-handoff { display: none; }
      html[data-cc-handoff] #boot-shell { display: none; }
      html[data-cc-handoff] #cc-handoff {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #FBF5E2;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        z-index: 2147483647;
      }
      html.dark[data-cc-handoff] #cc-handoff { background: #002b36; }
      #cc-handoff .card {
        position: relative;
        width: 100%;
        max-width: 24rem;
        padding: 1.5rem;
        border: 1px solid rgba(42, 161, 152, 0.3);
        border-radius: 0.75rem;
        background: #eee8d5;
        color: #002b36;
        box-shadow: 0 25px 50px -12px rgba(42, 161, 152, 0.1);
        animation: cc-handoff-in 200ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      html.dark #cc-handoff .card { background: #073642; color: #fdf6e3; }
      @keyframes cc-handoff-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      #cc-handoff .head { display: flex; align-items: center; gap: 0.75rem; }
      #cc-handoff .icon {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.5rem;
        background: rgba(42, 161, 152, 0.1);
        color: #2aa198;
      }
      #cc-handoff .title { font-size: 0.875rem; font-weight: 500; line-height: 1.25; }
      #cc-handoff .sub { font-size: 0.75rem; line-height: 1.25; color: #657b83; }
      #cc-handoff .actions { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1.25rem; }
      #cc-handoff button {
        font: inherit;
        cursor: pointer;
        border-radius: 0.375rem;
        padding: 0.5rem 0.75rem;
        font-size: 0.75rem;
      }
      #cc-handoff .primary {
        border: 0;
        background: #2aa198;
        color: #FBF5E2;
        font-weight: 500;
        transition: opacity 150ms;
      }
      #cc-handoff .primary:hover { opacity: 0.9; }
      #cc-handoff .secondary {
        border: 1px solid #93a1a1;
        background: transparent;
        color: #657b83;
        transition: color 150ms, border-color 150ms;
      }
      html.dark #cc-handoff .secondary { border-color: #586e75; }
      #cc-handoff .secondary:hover { color: inherit; border-color: rgba(42, 161, 152, 0.4); }
      #cc-handoff .tertiary {
        border: 0;
        background: transparent;
        color: #657b83;
        padding-top: 0.25rem;
        padding-bottom: 0;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: rgba(101, 123, 131, 0.4);
      }
      #cc-handoff .tertiary:hover { color: inherit; }
      /* Revealed when the browser refused to close the tab. */
      #cc-handoff .kept { display: none; margin-top: 0.75rem; font-size: 11px; line-height: 1.6; color: #657b83; }
      html[data-cc-handoff-kept] #cc-handoff .kept { display: block; }
      #cc-handoff kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        margin: 0 1px;
        font: inherit;
        font-size: 9px;
        line-height: 1;
        border: 1px solid rgba(147, 161, 161, 0.5);
        border-radius: 4px;
        background: #FBF5E2;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      html.dark #cc-handoff kbd { background: #002b36; border-color: rgba(88, 110, 117, 0.5); }
      #cc-handoff .dismiss {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        border: 0;
        background: transparent;
        color: #657b83;
        line-height: 1;
        padding: 0.25rem 0.5rem;
      }
      #cc-handoff .dismiss:hover { color: inherit; }
      #cc-handoff .always {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        font-size: 11px;
        color: #657b83;
        cursor: pointer;
        user-select: none;
      }
      #cc-handoff .always input { accent-color: #2aa198; cursor: pointer; }
    </style>
  </head>
  <body class="font-mono">
    <div id="root"></div>
    <div id="boot-shell" aria-hidden="true">

      </svg>
      <div class="bar"></div>
    </div>
    <div id="cc-handoff">
      <div class="card" role="dialog" aria-label="Opened in Codecast desktop">
        <button class="dismiss" data-cc-handoff-action="browser" aria-label="Dismiss">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
        <div class="head">
          <span class="icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="14" x="2" y="3" rx="2" />
              <path d="M8 21h8M12 17v4" />
            </svg>
          </span>
          <div>
            <div class="title">Opened in Codecast desktop</div>
            <div class="sub">This page was sent to the app.</div>
          </div>
        </div>
        <div class="actions">
          <button class="primary" data-cc-handoff-action="close">Close this tab</button>
          <button class="secondary" data-cc-handoff-action="browser">Open in browser</button>
          <button class="tertiary" data-cc-handoff-action="retry">Didn&rsquo;t open? Reopen desktop app</button>
        </div>
        <p class="kept">
          Your browser kept this tab open. Close it with
          <kbd data-cc-handoff-modifier>⌘</kbd><kbd>W</kbd>
        </p>
        <label class="always">
          <input type="checkbox" data-cc-handoff-action="always" />
          Always open Codecast links in browser
        </label>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
