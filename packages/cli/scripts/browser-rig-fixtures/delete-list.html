<!doctype html>
<html><head><meta charset="utf-8"><title>Delete list</title></head>
<body>
<h1>Items</h1>
<ul id="items">
  <li data-item="alpha">Alpha <button>Delete</button></li>
  <li data-item="bravo">Bravo <button>Delete</button></li>
  <li data-item="charlie">Charlie <button>Delete</button></li>
  <li data-item="delta">Delta <button>Delete</button></li>
</ul>
<p id="status">nothing deleted</p>
<script>
  const deleted = [];
  document.getElementById("items").addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    const li = e.target.closest("li");
    deleted.push(li.dataset.item);
    li.remove();
    document.getElementById("status").textContent = "deleted: " + deleted.join(", ");
  });
</script>
</body></html>
